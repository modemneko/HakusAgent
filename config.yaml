# HakusAI Chat 配置文件
# 支持环境变量覆盖，格式: ${ENV_VAR:default_value}

# ==================== API 密钥配置 ====================
api_keys:
  # Google Gemini API
  gemini_api_key: ${GEMINI_API_KEY:}
  google_api_key: ${GOOGLE_API_KEY:}
  google_cse_id: ${GOOGLE_CSE_ID:}
  
  # 阿里百炼 Qwen API
  dashscope_api_key: ${DASHSCOPE_API_KEY:***REMOVED***}
  
  # DeepSeek API
  deepseek_api_key: ${DEEPSEEK_API_KEY:***REMOVED***}
  
  # 智谱 GLM API
  glm_api_key: ${GLM_API_KEY:}
  
  # 小米 MiMo API
  mimo_api_key: ${MIMO_API_KEY:}
  
  # OpenCode Zen API
  opencode_api_key: ${OPENCODE_API_KEY:***REMOVED***}

  # Guardian API (默认使用 OpenCode)
  guardian_api_key: ${GUARDIAN_API_KEY:${OPENCODE_API_KEY:***REMOVED***}}

# ==================== 模型配置 ====================
models:
  # 默认使用的模型类型: gemini, qwen, deepseek, glm, mimo, opencode, 或自定义 provider 名
  default_model: ${DEFAULT_MODEL:opencode}
  
  # 运行模式: swift (单Agent+规则Tester, 省84%token) 或 deep (多Agent集群, 质量最高)
  run_mode: ${HAKUS_MODE:swift}
  
  # Gemini 模型设置
  gemini:
    model_name: ${GEMINI_MODEL_NAME:gemini-2.5-flash}
  
  # Qwen 模型设置
  qwen:
    model_name: ${QWEN_MODEL_NAME:qwen-flash}
  
  # DeepSeek 模型设置
  deepseek:
    model_name: ${DEEPSEEK_MODEL_NAME:deepseek-chat}
    base_url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
  
  # GLM 模型设置
  glm:
    model_name: ${GLM_MODEL_NAME:glm-4-flash}
  
  # MiMo 模型设置
  mimo:
    model_name: ${MIMO_MODEL_NAME:mimo-v2.5-pro}
    base_url: ${MIMO_BASE_URL:https://api.xiaomimimo.com/v1}

  # Ollama 本地模型设置
  ollama:
    model_name: ${OLLAMA_MODEL_NAME:gemma4}
    base_url: ${OLLAMA_BASE_URL:http://localhost:11434/v1}
  
  # OpenCode Zen 模型设置 (免费模型)
  opencode:
    model_name: ${OPENCODE_MODEL_NAME:mimo-v2.5-free}
    base_url: ${OPENCODE_BASE_URL:https://opencode.ai/zen/v1}

  # Guardian 审批模型设置 (独立轻量模型，默认使用 OpenCode mimo-v2.5-free)
  guardian:
    model_name: ${GUARDIAN_MODEL_NAME:mimo-v2.5-free}
    base_url: ${GUARDIAN_BASE_URL:https://opencode.ai/zen/v1}

# ==================== 自定义模型 Provider ====================
# 添加任意 OpenAI 兼容的 API 端点，在 models.default_model 中填入 key 即可使用
# 支持环境变量覆盖和 ${ENV:default} 语法
model_providers:
  # 示例：自定义中转站
  my_proxy:
    name: "OpenAI"
    model_name: "gpt-5.5"
    base_url: "https://goaistore.ccwu.cc/v1"
    api_key: ${MY_PROXY_KEY:***REMOVED***}
    wire_api: "responses"      
    requires_auth: true       # 是否需要 API key
  
  # 示例：硅基流动
  # siliconflow:
  #   name: "SiliconFlow"
  #   model_name: "deepseek-ai/DeepSeek-R1"
  #   base_url: "https://api.siliconflow.cn/v1"
  #   api_key: ${SILICONFLOW_API_KEY:}
  #   requires_auth: true

# ==================== Embedding 配置 ====================
embedding:
  # 类型: google 或 local
  type: ${EMBEDDING_TYPE:google}
  
  # Google Embedding 模型路径
  model_path: ${EMBEDDING_MODEL_PATH:shibing624/text2vec-base-chinese}
  
  # 本地 Embedding 模型路径
  local_model_path: ${LOCAL_EMBEDDING_MODEL_PATH:./embedding_models/text2vec-base-chinese}
  
  # 设备: cpu 或 cuda
  device: cpu
  
  # CPU 线程数
  thread_count: 4
  
  # 批处理大小
  batch_size: 8

# ==================== 记忆系统配置 ====================
memory:
  # 是否启用长期记忆 / Embedding 向量检索
  enabled: false
  # 短期记忆最大长度
  short_term_max_length: 50
  
  # 长期记忆最大长度
  long_term_max_length: 500
  
  # 数据目录 (统一存放在 ~/.hakus/ 下，不再污染工作目录)
  state_dir: ${HAKUS_STATE_DIR:~/.hakus/user_states}
  db_dir: ${HAKUS_MEMORY_DB_DIR:~/.hakus/memory_db}

# ==================== TTS 语音配置 ====================
tts:
  # 是否启用 TTS
  enabled: ${ENABLE_TTS:true}
  
  # 是否输出音频文件
  audio_output: ${ENABLE_TTS_AUDIO_OUTPUT:true}
  
  # TTS 类型: sherpa-onnx, api, cosyvoice, voxcpm, gptsovits 或 bert-vits2
  type: ${TTS_TYPE:voxcpm}

  # VoxCPM 本地模型路径 (支持 VoxCPM1.5 / VoxCPM2)
  voxcpm_path: ${VOXCPM_PATH:D:\项目\HakusAI_chat\voxcpm}
  voxcpm_model_path: ${VOXCPM_MODEL_PATH:./VoxCPM1.5/OpenBMB/VoxCPM1___5}
  
  # GPT-SoVITS v2 本地模型路径 (需要 CUDA 或 CPU)
  gptsovits_path: ${GPTSOVITS_PATH:D:\项目\HakusAI_chat\tts_engines\models\GPT-SoVITS}
  gptsovits_server_url: ${GPTSOVITS_SERVER_URL:http://127.0.0.1:9880}
  # 参考音频（用于零样本语音克隆，5-15秒音频+对应文本）
  gptsovits_ref_audio_path: ${GPTSOVITS_REF_AUDIO:}
  gptsovits_ref_text: ${GPTSOVITS_REF_TEXT:}
  gptsovits_language: ${GPTSOVITS_LANG:zh}
  
  # API TTS 配置
  api:
    api_type: ${TTS_API_TYPE:qwen}
    voice_id: ${TTS_VOICE_ID:kirara}
  
  # Sherpa-ONNX 本地 TTS 配置
  sherpa_onnx:
    model_dir: ${SHERPA_ONNX_MODEL_DIR:./tts_models}
    voice: ${SHERPA_ONNX_VOICE:zh}
    speed: ${SHERPA_ONNX_SPEED:1.0}
    volume: ${SHERPA_ONNX_VOLUME:1.0}
    pitch: ${SHERPA_ONNX_PITCH:1.0}
    audio_format: ${SHERPA_ONNX_AUDIO_FORMAT:wav}
    sample_rate: ${SHERPA_ONNX_SAMPLE_RATE:24000}
    device: ${SHERPA_ONNX_DEVICE:cpu}

  # 百炼 CosyVoice TTS 配置 (支持语音克隆和流式输出)
  # 支持中、英、日等多语种语音克隆
  # 使用阿里百炼API，需要配置 DASHSCOPE_API_KEY
  # 
  # 模型版本说明:
  # - cosyvoice-v3-flash: 快速版，支持多语种（中英日韩法德俄葡泰印越）
  # - cosyvoice-v3-plus: 高质量版，支持多语种（中英日韩法德俄）
  # - cosyvoice-v3.5-flash: 最新快速版，仅北京地域可用
  # - cosyvoice-v3.5-plus: 最新高质量版，仅北京地域可用
  #
  # 声音复刻流程:
  # 1. 将音频上传到公网可访问的URL（如阿里云OSS）
  # 2. 调用 create_voice_from_url() 创建音色
  # 3. 获取返回的 voice_id 用于后续语音合成
  cosyvoice:
    # 模型选择 (v3.5-plus效果最好，v3-flash速度最快)
    model: ${COSYVOICE_MODEL:cosyvoice-v3-flash}
    
    # 音色ID (复刻音色ID，如: cosyvoice-v3-flash-kirara-xxxxx)
    # 如果已有复刻的音色，直接填写；否则使用 create_voice_from_url() 创建
    voice_id: ${COSYVOICE_VOICE_ID:}
    
    # 参考音频URL (用于语音克隆，需要公网可访问)
    # 支持 10-20秒 音频，格式: WAV(16bit)/MP3/M4A，采样率>=16kHz
    ref_audio_url: ${COSYVOICE_REF_AUDIO_URL:}
    
    # 参考音频语种提示 (帮助模型更准确提取音色特征)
    # 可选值: zh(中文), ja(日语), en(英文), ko(韩语), fr, de, ru, pt, th, id, vi
    language_hints: ${COSYVOICE_LANGUAGE_HINTS:ja}
    
    # 是否启用流式输出
    streaming: ${COSYVOICE_STREAMING:true}
    
    # 音频格式: wav, mp3, pcm
    format: ${COSYVOICE_FORMAT:wav}
    
    # 采样率
    sample_rate: ${COSYVOICE_SAMPLE_RATE:22050}
    
    # 音色前缀 (创建音色时使用，仅允许数字和小写字母，不超过10个字符)
    voice_prefix: ${COSYVOICE_VOICE_PREFIX:kirara}

# ==================== 功能开关 ====================
features:
  # 是否启用图像生成
  enable_image_generation: false

# ==================== 虚拟主播配置 ====================
virtual_avatar:
  # 角色名称
  name: 小雪
  
  # Live2D 模型配置
  model:
    # 模型路径 (支持 .model.json 或 .model3.json)
    path: ""
    # 缩放比例
    scale: 1.0
    # 自动眨眼
    auto_blink: true
    # 待机动画
    idle_animation: true
    # 跟随鼠标
    look_at_mouse: true
  
  # 窗口配置
  window:
    width: 500
    height: 600
    always_on_top: true
    transparent: true
    frameless: true
    opacity: 1.0
  
  # 嘴型同步配置
  lip_sync:
    enabled: true
    # 嘴巴开合速度
    speed: 0.1
    # 最大开合度
    max_open: 1.0
  
  # TTS 集成
  tts:
    enabled: true
    # 说话时嘴型同步
    sync_mouth: true

# ==================== Agent 配置 ====================
agent:
  # 最大迭代次数 (默认30，复杂任务可能不够)
  max_iterations: 100
  
  # LLM API 调用超时 (秒) - DeepSeek 等API响应可能较慢
  llm_timeout: 180
  
  # 工具执行超时 (秒)
  tool_timeout: 120
  
  # 工具执行后的等待超时 (秒)
  follow_up_timeout: 180
  
  # 最大上下文 token 数
  max_context_tokens: 200000

# ==================== 日志配置 ====================
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR, CRITICAL

# ==================== 调试配置 ====================
debug: true  # 启用按轮数调试日志 (也可用 HAKUS_DEBUG=1 环境变量)
# 日志目录: ~/.hakus/debug/<session_id>/turn_001.log

# ==================== 语音对话配置 ====================
voice:
  # ASR 语音识别配置
  asr:
    # 识别引擎: funasr
    provider: ${ASR_PROVIDER:funasr}
    # FunASR 模型名称 (SenseVoiceSmall 支持中英日韩粤多语种)
    model: ${ASR_MODEL:SenseVoiceSmall}
    # 采样率
    sample_rate: ${ASR_SAMPLE_RATE:16000}
    # 语言: auto 自动检测
    language: ${ASR_LANGUAGE:auto}
    # 语音活动检测阈值 (0-32767, 越低越灵敏)
    threshold: ${ASR_THRESHOLD:600}
    # 最短语音时长 (秒)
    min_duration: ${ASR_MIN_DURATION:0.3}
    # 静音超时 (秒, 超过此时间认为说完)
    silence_timeout: ${ASR_SILENCE_TIMEOUT:1.0}
  
  # 语音对话 TTS 配置 (独立于主 TTS 配置)
  tts:
    # TTS 引擎: bert-vits2, sherpa-onnx, cosyvoice, api
    provider: ${VOICE_TTS_PROVIDER:bert-vits2}
    # BertVITS2 模型目录
    model_dir: ${BERT_VITS2_MODEL_DIR:./models/tts/bert_vits2}
    # BertVITS2 生成配置文件
    gen_config: ${BERT_VITS2_GEN_CONFIG:./configs/gen_config.json}
    # 音色ID
    voice_id: ${VOICE_TTS_VOICE_ID:}
    # 采样率
    sample_rate: ${VOICE_TTS_SAMPLE_RATE:22050}
    # 音频输出目录
    output_dir: ${VOICE_OUTPUT_DIR:./output}
  
  # 语音对话模式配置
  live:
    # 是否启用语音对话
    enabled: ${VOICE_LIVE_ENABLED:false}
    # 角色名称
    character_name: ${VOICE_CHARACTER_NAME:羽汐}
