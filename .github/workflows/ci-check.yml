# 轻量编译检查 — 在重型 build-all 之前快速抓出 TS / Vite / Rust 编译错误。
#
# 背景：8023d38 之后的修复曾因无法本地验证而依赖 build-all 的完整产物构建，
# 一旦 Rust 或前端编译失败，用户就会拿旧 artifacts 当新版本实机测试。
# 本工作流只做 cargo check + 前端构建，几分钟内给出结果。
name: ci-check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "HakusAgent/frontend/desktop-tauri/**"
      - ".github/workflows/ci-check.yml"
  push:
    branches:
      - "fix/**"
      - "ci/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-tauri-check:
    name: desktop-tauri-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install system deps (webkit2gtk etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config

      - name: Plugin version alignment (Rust crate vs NPM pkg)
        run: |
          python3 - <<'EOF'
          import re, json, sys

          lock = open('HakusAgent/frontend/desktop-tauri/src-tauri/Cargo.lock').read()
          rust = {m.group(1): m.group(2) for m in
                  re.finditer(r'name = "(tauri-plugin-[^"]+)"\nversion = "([^"]+)"', lock)}

          d = json.load(open('HakusAgent/frontend/desktop-tauri/package-lock.json'))
          npm = {}
          prefix = 'node_modules/@tauri-apps/plugin-'
          for k, v in d['packages'].items():
              if k.startswith(prefix):
                  npm['tauri-plugin-' + k[len(prefix):]] = v['version']

          if 'tauri-plugin-updater' not in npm:
              print('FATAL: npm mapping failed, alignment check is not comparing anything')
              sys.exit(1)

          bad = []
          for name, rv in sorted(rust.items()):
              nv = npm.get(name)
              if nv and rv.split('.')[:2] != nv.split('.')[:2]:
                  bad.append(f'{name}: rust crate {rv} vs npm {nv}')

          if bad:
              print('Tauri plugin version mismatch detected:')
              for b in bad:
                  print('  ' + b)
              print('Fix: bump the NPM package (and package-lock) to the same major.minor as the Rust crate.')
              sys.exit(1)
          print('All tauri-plugin Rust crates aligned with NPM packages (major.minor).')
          EOF

      - name: Frontend typecheck + build + tests
        working-directory: HakusAgent/frontend/desktop-tauri
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
          npx vitest run

      - name: Rust check (locked)
        working-directory: HakusAgent/frontend/desktop-tauri/src-tauri
        run: cargo check --locked
