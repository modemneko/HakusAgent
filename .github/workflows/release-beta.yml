# HakusAI Beta Release — build desktop + installer, publish prerelease.
#
# Trigger: manual workflow_dispatch or tag `v*-beta.*` / `v*-rc.*`.
# Always marks the GitHub Release as prerelease.

name: release-beta

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.0-beta.1)"
        required: true
      name:
        description: "Release title"
        required: false
  push:
    tags:
      - "v*-beta.*"
      - "v*-rc.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          NAME="${{ inputs.name }}"
          if [ -z "$NAME" ]; then
            NAME="HakusAI ${TAG} (Beta)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  desktop-windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install desktop frontend deps
        working-directory: HakusAgent/frontend/desktop-tauri
        run: npm ci

      - name: Build desktop app
        working-directory: HakusAgent/frontend/desktop-tauri
        run: npx tauri build

      - name: Stage portable payload
        shell: pwsh
        run: |
          ./scripts/package-installer-payload.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-bundles
          path: |
            HakusAgent/frontend/desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
            HakusAgent/frontend/installer/src-tauri/payload/app-payload.zip
          if-no-files-found: error

  installer-windows:
    needs: desktop-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows-bundles
          path: _artifacts

      - name: Restore payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path HakusAgent/frontend/installer/src-tauri/payload | Out-Null
          Copy-Item _artifacts/app-payload.zip HakusAgent/frontend/installer/src-tauri/payload/app-payload.zip -Force

      - name: Install installer frontend deps
        working-directory: HakusAgent/frontend/installer
        run: npm ci || npm install

      - name: Build branded installer
        working-directory: HakusAgent/frontend/installer
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: HakusAgent/frontend/installer/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  desktop-others:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact: macos-arm64
            args: "--target aarch64-apple-darwin"
            paths: |
              HakusAgent/frontend/desktop-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: macos-14
            artifact: macos-x64
            args: "--target x86_64-apple-darwin"
            paths: |
              HakusAgent/frontend/desktop-tauri/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: ubuntu-22.04
            artifact: linux
            args: ""
            paths: |
              HakusAgent/frontend/desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
              HakusAgent/frontend/desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-14' && 'x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: HakusAgent/frontend/desktop-tauri
        run: npm ci

      - name: Build Tauri app
        working-directory: HakusAgent/frontend/desktop-tauri
        run: npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: warn

  publish:
    needs: [meta, desktop-windows, installer-windows, desktop-others]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: _release
          merge-multiple: true

      - name: Compose release notes
        shell: bash
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          SHA="${{ needs.meta.outputs.sha }}"
          cat > notes.md <<EOF
          ## HakusAI ${TAG} — Beta / 测试版

          > **Channel:** prerelease (not installed by stable auto-update)
          > **Built from:** \`${SHA}\`
          > **Windows recommended:** \`HakusAI-Installer-*-windows-x64.exe\`

          ### 本版亮点 / Highlights
          - 修复打开「模型」设置时的 React #300（hooks 顺序）
          - 全屏带动画启动画面
          - 独立品牌安装向导（语言 / 许可 / 路径 / 组件 / 数据迁移）
          - 安装器 BMP 与品牌色统一

          ### 使用说明 / User guide
          完整中英文教程见仓库 [\`docs/RELEASE_GUIDE.zh-en.md\`](https://github.com/${{ github.repository }}/blob/${SHA}/docs/RELEASE_GUIDE.zh-en.md)

          ### 构建信息 / Build
          - Repository: \`${{ github.repository }}\`
          - Workflow: \`${{ github.workflow }}\` run \`${{ github.run_id }}\`
          - Commit: \`${SHA}\`
          EOF

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.name }}
          body_path: notes.md
          prerelease: true
          generate_release_notes: true
          files: |
            _release/**/*.exe
            _release/**/*.dmg
            _release/**/*.deb
            _release/**/*.AppImage
            _release/**/*.zip
