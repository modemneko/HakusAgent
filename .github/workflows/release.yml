name: Release

# =====================================================================
# HakusAI Desktop Client — 三平台自动打包 + 直接上传到 GitHub Release
# =====================================================================
#
# 触发方式:
#   1. 推 tag (v0.1.0, v1.2.3, ...) → 构建三平台 + 发布正式 Release (含 latest*.yml)
#   2. 推 master → 构建三平台 + 滚动更新 "nightly" 预发布 Release (含 latest*.yml)
#   3. Actions 页面手动点 "Run workflow" → 同 master 行为 (发到 nightly)
#
# 产物 (每个平台一份):
#   - Windows: HakusAI-Setup-x.y.z.exe           (NSIS 安装程序)
#   - macOS:   HakusAI-x.y.z.dmg + .dmg.blockmap  (DMG 镜像, x64 + arm64)
#   - Linux:   HakusAI-x.y.z.AppImage + .deb      (AppImage + Debian 包)
#
# 工作流:
#   cleanup (清空旧 artifacts 释放存储配额)
#     ↓
#   prepare-nightly (master 推送时) - 单 job, 先于 build 清空 nightly Release assets
#     ↓
#   build (matrix: win/mac/linux)
#     ↓ 每个 job 直接把产物上传到对应的 GitHub Release (不走 artifact 系统)
#   (没有 release job, 因为 build jobs 已经直接上传到 Release 了)
#
# 关键设计 (避免 GitHub Actions 500 MB artifact 存储配额耗尽):
#   - GitHub Release 存储**独立于** Actions artifact 存储
#   - 公共仓库 Release 存储免费且无配额限制
#   - 所以每个 build job 构建完直接调 gh-release API 把产物
#     附加到对应的 GitHub Release 上, 完全绕过 artifact 系统
#   - 即便配额被旧 artifact 占满 (recalculate 6-12 小时一次),
#     新构建的安装包仍然能通过 Release 流到用户手里
#
# Nightly 滚动 Release (master 推送时):
#   - 所有 master 推送的产物统一上传到 tag="nightly" 的预发布 Release
#   - **重要**: pre-clean 由独立的 prepare-nightly job 完成 (单次, 串行),
#     不再由每个 build matrix job 各自执行. 旧版本里 pre-clean 在 matrix
#     里跑, 三平台并行各自删 nightly assets → race condition: 后跑完
#     pre-clean 的平台会删掉先跑完 upload 的平台刚上传的 assets, 导致
#     nightly Release 上只剩最后一个平台的文件, 甚至全空.
#   - 现在 prepare-nightly 在 build 之前串行执行一次清空, 之后 build
#     matrix 并行 upload (softprops/action-gh-release 对不同名文件是
#     append 模式), 三平台产物全部保留.
#   - 同时附 commit SHA + 构建时间, 方便排查
#   - 用户可通过该 Release URL 手动下载体验最新功能
#   - 注: 暂不让 electron-updater 自动从 nightly 升级 (避免不稳定);
#         自动升级只走 latest (正式 Release) 通道
# =====================================================================

on:
  push:
    tags:
      - 'v*'           # 推 v 开头的 tag 触发正式发布
    branches:
      - master         # 推 master 触发 nightly 构建
  workflow_dispatch:   # 手动触发 (Actions 页面点 Run workflow) — 走 nightly 通道

permissions:
  contents: write     # 上传 Release 资产 + 创建 Release 需要写权限
  actions: write      # 清理旧 artifacts 需要 actions:write 权限

jobs:
  # =====================================================================
  # Cleanup job — 先于 build 运行, 清空 repo 内所有旧 artifacts
  # =====================================================================
  # GitHub Actions 免费账户有 500 MB artifact 存储配额。虽然本 workflow
  # 现在不再依赖 artifact 上传, 但保留 cleanup 以防其他 workflow 累积.
  # =====================================================================
  cleanup:
    name: 🧹 Cleanup old artifacts
    runs-on: ubuntu-latest
    steps:
      - name: 🗑️ Delete all previous artifacts
        uses: actions/github-script@v7
        with:
          script: |
            let deleted = 0;
            let page = 1;
            while (true) {
              const resp = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page: page,
              });
              if (resp.data.artifacts.length === 0) break;
              for (const artifact of resp.data.artifacts) {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                  });
                  core.info(`✓ Deleted "${artifact.name}" (id=${artifact.id}, ${artifact.size_in_bytes} bytes)`);
                  deleted++;
                } catch (err) {
                  core.warning(`Failed to delete artifact ${artifact.name} (id=${artifact.id}): ${err.message}`);
                }
              }
              if (resp.data.artifacts.length < 100) break;
              page++;
            }
            core.info(`Cleanup complete. Deleted ${deleted} artifacts total.`);

  # =====================================================================
  # Prepare-nightly job — master 推送时, 在 build 之前清空 nightly Release
  # =====================================================================
  # 关键: 这一步必须在 build matrix 之前串行执行, 且只执行一次.
  #
  # 旧设计里, 这一步嵌在 build matrix 内, 三平台并行各自删除 nightly
  # Release 上的所有 assets. 因为 matrix 是并行的, 时序变成:
  #   T0: 三平台都开始 pre-clean
  #   T1: Linux 跑完 pre-clean, 开始 upload, 上传 AppImage+deb+yml
  #   T2: Windows 跑完 pre-clean (删除 Linux 刚上传的 assets), 开始 upload
  #   T3: macOS 跑完 pre-clean (删除 Windows 和 Linux 上传的 assets), 开始 upload
  # 最终 nightly Release 上只剩最后一个跑完 pre-clean 的平台的 assets.
  #
  # 新设计: 把 pre-clean 拆出来作为独立 job, build matrix needs 它.
  # prepare-nightly 跑完一次清空后, build 三平台并行 upload (append 模式),
  # 不同名文件互不冲突, 三平台产物全部保留.
  # =====================================================================
  prepare-nightly:
    name: 🧹 Prepare nightly release
    runs-on: ubuntu-latest
    needs: cleanup
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    steps:
      - name: 🧹 Pre-clean nightly assets (single-shot, before build)
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'nightly';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              const assets = release.data.assets || [];
              core.info(`Found ${assets.length} existing assets on "${tag}" release.`);
              for (const asset of assets) {
                try {
                  await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
                  core.info(`  ✓ Deleted ${asset.name}`);
                } catch (err) {
                  core.warning(`  ✗ Failed to delete ${asset.name}: ${err.message}`);
                }
              }
              core.info(`Pre-clean complete. ${assets.length} asset(s) removed.`);
            } catch (err) {
              if (err.status === 404) {
                core.info(`Nightly release does not exist yet — will be created by upload step.`);
              } else {
                throw err;
              }
            }

  # =====================================================================
  # Build job — 三平台并行构建, 完成后直接上传到 GitHub Release
  # =====================================================================
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.platform }})
    # needs prepare-nightly (master push) 保证 master 推送时 build 在 pre-clean 之后跑
    # 但 tag push 时 prepare-nightly 被 skip, 我们仍要 build, 所以加 if: always()
    # 配合 !failure() && !cancelled(): cleanup 或 prepare-nightly 失败时不跑 build
    needs: prepare-nightly
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false  # 一个平台失败不影响其他平台继续构建
      matrix:
        include:
          - os: windows-latest
            platform: win
            asset_ext: exe
          - os: macos-latest
            platform: mac
            asset_ext: dmg
          - os: ubuntu-latest
            platform: linux
            asset_ext: AppImage

    runs-on: ${{ matrix.os }}
    steps:
      # ============ 1. Checkout ============
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      # ============ 2. Setup Node.js 22 (LTS) ============
      - name: 📦 Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/client/package-lock.json

      # ============ 3. Setup Python 3.11 ============
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # ============ 4. Install Python deps + PyInstaller + Pillow ============
      # 用 `pip install -e .` 而不是 `pip install -r requirements.txt`：
      # pyproject.toml 是依赖清单的单一来源 (source of truth)，requirements.txt
      # 历史上曾漏装 numpy / httpx / python-dotenv / pydantic-settings / rich /
      # textual，导致 PyInstaller 打出来的 exe 在用户机器上 "No module named xxx"。
      - name: 🔧 Install Python dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller pillow

      # ============ 4.5. Import smoke test (sidecar 启动链预检) ============
      - name: 🧪 Sidecar import smoke test
        working-directory: .
        run: |
          python -c "from hakusai_server.server import HakusAIServer; print('sidecar import chain OK')"
          python -c "import numpy, watchdog, fastapi, uvicorn, pydantic, httpx, aiohttp, websockets, dotenv, pydantic_settings, rich, textual, yaml, multipart; print('all required 3rd-party modules importable')"

      # ============ 5. Build HakusAI sidecar (PyInstaller) ============
      - name: 🔨 Build HakusAI server sidecar
        working-directory: frontend/client
        run: bash scripts/build-sidecar.sh

      # ============ 6. Verify sidecar binary exists ============
      - name: ✅ Verify sidecar binary
        working-directory: frontend/client
        shell: bash
        run: |
          echo "Sidecar dist contents:"
          ls -la sidecar/dist/ || true
          if [ ! -f sidecar/dist/hakusai-server ] && [ ! -f sidecar/dist/hakusai-server.exe ]; then
            echo "⚠️  Warning: sidecar binary not found. Build will continue without bundled Python backend."
          else
            echo "✓ Sidecar binary present"
          fi

      # ============ 7. Install npm dependencies ============
      - name: 📥 Install npm dependencies
        working-directory: frontend/client
        run: npm ci

      # ============ 8. Generate icon set ============
      - name: 🎨 Generate icon set
        working-directory: frontend/client
        run: python3 scripts/make-icon.py

      # ============ 9. Build & package Electron app ============
      # 注：package.json 没有 `build.publish` 配置。这是故意的 —— electron-builder
      # 25.x 在 publish+deb 组合下会触发 "adding autoupdate files for: deb
      # (Beta feature)" 步骤, 在三平台 CI 上都崩 (ERR_ELECTRON_BUILDER_CANNOT_EXECUTE).
      # 我们改成: 打包时不带 publish, 然后下一步用 scripts/generate-update-manifests.py
      # 手动生成 latest*.yml, 运行时由 electron-updater 的 setFeedURL 找到 GitHub
      # Release 上的 yml + 安装包.
      - name: 📦 Build Electron app (${{ matrix.platform }})
        working-directory: frontend/client
        run: npm run dist:${{ matrix.platform }}
        env:
          CI: true
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_SYSTEM_FPM: false

      # ============ 10. List build artifacts (BEFORE manifest generation) ============
      # 列出 release/ 下所有文件 (递归). 这一步在 manifest 生成之前跑, 这样
      # 即便 manifest 步骤后面失败, 我们也能看到 electron-builder 实际产出了什么.
      - name: 📋 List build artifacts
        working-directory: frontend/client
        shell: bash
        run: |
          echo "=== release/ top-level ==="
          ls -la release/ || true
          echo ""
          echo "=== release/ recursive (find) ==="
          # Use python so this works on Windows Git Bash too (BSD find doesn't support -printf)
          python3 -c "
          import os
          for root, dirs, files in os.walk('release'):
            for f in sorted(files):
              p = os.path.join(root, f)
              try: sz = os.path.getsize(p)
              except OSError: sz = -1
              print(f'{sz:>10}  {p}')
          " 2>/dev/null || true
          echo ""
          echo "=== File sizes ==="
          du -h release/* 2>/dev/null || true

      # ============ 10b. Generate electron-updater manifests ============
      # 因为 package.json 没有 publish 配置, electron-builder 不会自动生成
      # latest*.yml. 这里手动生成, 给 electron-updater 用.
      # 注: 这一步放在 "List build artifacts" 之后, 这样即使本步骤失败, 上一步
      # 的目录列表也已经写到日志里, 便于排查为什么找不到 installer.
      - name: 📝 Generate update manifests (latest*.yml)
        working-directory: frontend/client
        shell: bash
        run: |
          python3 scripts/generate-update-manifests.py \
            --version "$(node -p "require('./package.json').version")" \
            --release-dir release/

      # ============ 11a. (Removed) Pre-clean nightly assets ============
      # 这一步已经挪到独立的 prepare-nightly job, 在 build 之前串行执行一次.
      # 原因: 旧版本里 pre-clean 在 matrix 内并行跑, 后跑完 pre-clean 的平台
      # 会删掉先跑完 upload 的平台刚上传的 assets, 导致 nightly Release 上
      # 只剩最后一个平台的文件, 甚至全空 (race condition).
      # 现在三平台 build job 只负责 append upload, 不再删 assets.
      # =================================================================

      # ============ 11b. Upload installers to GitHub Release (tag push) ============
      # 关键: 直接把产物上传到 GitHub Release, 完全绕过 Actions artifact 系统
      # 这样即使 artifact 存储配额耗尽, 安装包仍然能通过 Release 流到用户
      #
      # 推 tag (v*): 发正式 Release, latest*.yml 让 electron-updater 走正式通道
      # =====================================================================
      - name: 📤 Upload installers to GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HakusAI ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 每个 matrix job 只产出自己平台的文件, 其他平台的 glob 不会匹配.
          # fail_on_unmatched_files=false: 未匹配的 glob 不算错, 避免误报.
          fail_on_unmatched_files: false
          files: |
            frontend/client/release/*.exe
            frontend/client/release/*.dmg
            frontend/client/release/*.AppImage
            frontend/client/release/*.deb
            frontend/client/release/*.snap
            frontend/client/release/*.blockmap
            frontend/client/release/latest*.yml
          body: |
            # HakusAI Desktop Client ${{ github.ref_name }}

            ## 📦 下载

            | 平台 | 文件 | 说明 |
            |---|---|---|
            | **Windows** | `HakusAI-Setup-*.exe` | NSIS 安装程序, 双击即装 |
            | **macOS (Intel)** | `HakusAI-*-x64.dmg` | Intel Mac |
            | **macOS (Apple Silicon)** | `HakusAI-*-arm64.dmg` | M1/M2/M3 Mac |
            | **Linux** | `HakusAI-*.AppImage` | 直接运行, 无需安装 |
            | **Linux** | `hakusai-client_*.deb` | Debian/Ubuntu 安装包 |

            ## ✨ 特性

            - 🎨 Cherry Studio 风格 UI, 暗色主题
            - 🤖 完整 AgentEvent 协议支持 (流式文本, 工具调用, 思维链)
            - 💬 多会话管理, SQLite 持久化
            - 🔌 内嵌 Python 后端 (sidecar), **开箱即用, 无需额外配置**
            - 📝 Markdown 渲染 + 代码高亮
            - 🛠️ 可视化工具调用卡片
            - 🔧 24 个内置工具 (含 git_diff / apply_patch / todo_write)
            - 🛡️ 权限系统默认 ASK, 双层防御 (.aws/credentials / rm -rf / 永远拒绝)
            - 🔍 Grep 工具改用 ripgrep (大仓库毫秒级搜索)
            - 🧩 **新**: MCP (Model Context Protocol) 客户端 — 接入外部 stdio MCP server
            - 🖥️ **新**: 系统托盘 + 全局快捷键 (Shift+Ctrl/Cmd+H 唤起)
            - 🔄 **新**: electron-updater 自动更新 (从 GitHub Release 拉取)
            - 💾 **新**: 数据备份 (一键导出 ~/.hakus 全量快照)

            ## 🚀 使用

            1. 下载对应平台的安装包
            2. 安装并启动
            3. 在「设置 → 连接」里配置你的 LLM API Key (DeepSeek / GLM / Qwen 等)
            4. 开始对话

            > 💡 macOS 用户首次启动如果提示"无法验证开发者", 请右键 → 打开

            ## 📝 完整变更日志

            见下方自动生成的 Release Notes。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============ 11c. Upload installers to Nightly Release (master push) ============
      # 推 master: 滚动更新 nightly Release. prepare-nightly job 已经在 build
      # 之前串行清空过 nightly assets, 这里直接 append 上传.
      # 三平台 matrix 并行 upload, 但每个平台只上传自己平台的文件 (文件名不同),
      # softprops/action-gh-release 对不同名文件是 append 模式, 互不冲突.
      # make_latest=false 保证正式 Release 优先级不变, prerelease=true 让
      # GitHub 把它标记为 "Pre-release".
      # =====================================================================
      - name: 📤 Upload installers to Nightly Release (master push)
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: HakusAI Nightly (dev build)
          # 每个 matrix job 只产出自己平台的文件, 其他平台的 glob 不会匹配.
          # fail_on_unmatched_files=false: 未匹配的 glob 不算错, 避免误报.
          fail_on_unmatched_files: false
          body: |
            ## 🌙 Nightly 自动构建

            **Commit**: ${{ github.sha }}
            **Branch**: master
            **CI Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **构建时间**: ${{ github.run_started_at }}

            > ⚠️ 这是 master 分支最新提交的自动构建版本，**不保证稳定**。
            > 如需稳定版请使用 [latest release](https://github.com/${{ github.repository }}/releases/latest)。
            >
            > 每次新 master 推送会覆盖该 Release 上的所有安装包，所以这里永远是最新构建。

            ## 📦 下载

            | 平台 | 文件 | 说明 |
            |---|---|---|
            | **Windows** | `HakusAI-Setup-*.exe` | NSIS 安装程序 |
            | **macOS (Intel)** | `HakusAI-*-x64.dmg` | Intel Mac |
            | **macOS (Apple Silicon)** | `HakusAI-*-arm64.dmg` | M1/M2/M3 Mac |
            | **Linux** | `HakusAI-*.AppImage` | 直接运行 |
            | **Linux** | `hakusai-client_*.deb` | Debian/Ubuntu |
          prerelease: true
          make_latest: 'false'
          files: |
            frontend/client/release/*.exe
            frontend/client/release/*.dmg
            frontend/client/release/*.AppImage
            frontend/client/release/*.deb
            frontend/client/release/*.snap
            frontend/client/release/*.blockmap
            frontend/client/release/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============ 12. (Fallback) Upload to Actions artifacts ============
      # 备用: 同时上传到 Actions artifacts, 万一 Release 上传失败用户仍能下载
      # continue-on-error=true: 即使配额耗尽也不阻塞构建成功
      # retention-days: 7 (从 1 天提到 7 天) — 释放存储配额的同时给用户更长的下载窗口
      - name: 📤 Upload artifacts (best-effort, non-blocking)
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: hakusai-${{ matrix.platform }}-${{ github.sha }}
          path: |
            frontend/client/release/*.exe
            frontend/client/release/*.dmg
            frontend/client/release/*.AppImage
            frontend/client/release/*.deb
            frontend/client/release/*.snap
            frontend/client/release/*.blockmap
            frontend/client/release/latest*.yml
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
