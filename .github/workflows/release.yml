name: Release

# =====================================================================
# HakusAI Desktop Client — 三平台自动打包 + GitHub Release 发布
# =====================================================================
#
# 触发方式:
#   1. 推 tag (v0.1.0, v1.2.3, ...) → 自动构建三平台并发布 Release
#   2. Actions 页面手动点 "Run workflow" → 仅构建, 不发布 Release (产物在 Actions artifacts)
#   3. 推 master → 触发构建, 产物上传到 Actions artifacts (retention = 1 天)
#
# 产物 (每个平台一份):
#   - Windows: HakusAI-Setup-x.y.z.exe           (NSIS 安装程序)
#   - macOS:   HakusAI-x.y.z.dmg + .dmg.blockmap  (DMG 镜像, x64 + arm64)
#   - Linux:   HakusAI-x.y.z.AppImage + .deb      (AppImage + Debian 包)
#
# 工作流:
#   cleanup (清空旧 artifacts 释放存储配额)
#     ↓
#   build (matrix: win/mac/linux) — setup → build-sidecar → npm ci → npm run dist:PLATFORM
#     ↓ (仅推 tag 时)
#   release — 汇总三平台产物到 GitHub Release
#
# 注意:
#   - PyInstaller 不能交叉编译, 所以三平台必须分别在三台 runner 上构建
#   - GitHub Actions 免费账户有 500 MB artifact 存储配额, 所以每次构建前
#     先清空所有旧 artifacts (cleanup job), 且新 artifacts 仅保留 1 天
#   - 所有 actions 用最新主版本 (Node.js 24), 避免 Node.js 20 弃用警告
# =====================================================================

on:
  push:
    tags:
      - 'v*'           # 推 v 开头的 tag 触发正式发布
    branches:
      - master         # 推 master 也触发构建 (产物上传到 Actions artifacts, 不发 Release)
  workflow_dispatch:   # 手动触发 (Actions 页面点 Run workflow)

permissions:
  contents: write     # 发布 Release 需要写权限
  actions: write      # 清理旧 artifacts 需要 actions:write 权限

jobs:
  # =====================================================================
  # Cleanup job — 先于 build 运行, 清空 repo 内所有旧 artifacts
  # =====================================================================
  # GitHub Actions 免费账户有 500 MB artifact 存储配额。每次构建三平台
  # 会产生 ~150-300 MB artifacts, 几次累积就会超配额, 导致
  # "Failed to CreateArtifact: Artifact storage limits" 错误。
  # 这个 job 在 build 之前先把 repo 内所有旧 artifacts 删掉, 释放配额。
  # 用 github-script 调 REST API, 不依赖 gh CLI。
  # =====================================================================
  cleanup:
    name: 🧹 Cleanup old artifacts
    runs-on: ubuntu-latest
    steps:
      - name: 🗑️ Delete all previous artifacts
        uses: actions/github-script@v7
        with:
          script: |
            let deleted = 0;
            let page = 1;
            while (true) {
              const resp = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page: page,
              });
              if (resp.data.artifacts.length === 0) break;
              for (const artifact of resp.data.artifacts) {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                  });
                  core.info(`✓ Deleted "${artifact.name}" (id=${artifact.id}, ${artifact.size_in_bytes} bytes, created ${artifact.created_at})`);
                  deleted++;
                } catch (err) {
                  // 已经被删 / 权限不够 / 等等 — 不阻塞, 只记日志
                  core.warning(`Failed to delete artifact ${artifact.name} (id=${artifact.id}): ${err.message}`);
                }
              }
              if (resp.data.artifacts.length < 100) break;
              page++;
            }
            core.info(`Cleanup complete. Deleted ${deleted} artifacts total.`);

  # =====================================================================
  # Build job — 三平台并行构建
  # =====================================================================
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.platform }})
    needs: cleanup
    strategy:
      fail-fast: false  # 一个平台失败不影响其他平台继续构建
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact_name: hakusai-windows
            asset_ext: exe
          - os: macos-latest
            platform: mac
            artifact_name: hakusai-macos
            asset_ext: dmg
          - os: ubuntu-latest
            platform: linux
            artifact_name: hakusai-linux
            asset_ext: AppImage

    runs-on: ${{ matrix.os }}
    steps:
      # ============ 1. Checkout ============
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      # ============ 2. Setup Node.js 22 (LTS) ============
      - name: 📦 Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/client/package-lock.json

      # ============ 3. Setup Python 3.11 ============
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # ============ 4. Install Python deps + PyInstaller + Pillow ============
      # 用 `pip install -e .` 而不是 `pip install -r requirements.txt`：
      # pyproject.toml 是依赖清单的单一来源 (source of truth)，requirements.txt
      # 历史上曾漏装 numpy / httpx / python-dotenv / pydantic-settings / rich /
      # textual，导致 PyInstaller 打出来的 exe 在用户机器上 "No module named xxx"。
      - name: 🔧 Install Python dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller pillow

      # ============ 4.5. Import smoke test (sidecar 启动链预检) ============
      # 在 PyInstaller 之前验证 sidecar 启动时的完整 import 链能跑通。
      # 如果这里失败，CI 立即终止，不会打出一个用户一跑就崩的 exe。
      # 历史上 "No module named 'watchdog'" / "No module named 'numpy'"
      # 都是因为缺这一步，PyInstaller 静态分析看不出来运行时 import 失败。
      - name: 🧪 Sidecar import smoke test
        working-directory: .
        run: |
          python -c "from hakusai_server.server import HakusAIServer; print('sidecar import chain OK')"
          python -c "import numpy, watchdog, fastapi, uvicorn, pydantic, httpx, aiohttp, websockets, dotenv, pydantic_settings, rich, textual, yaml, multipart; print('all required 3rd-party modules importable')"

      # ============ 5. Build HakusAI sidecar (PyInstaller) ============
      # 生成 frontend/client/sidecar/dist/hakusai-server 二进制
      # 这一步必须和目标平台原生构建 (PyInstaller 不能交叉编译)
      - name: 🔨 Build HakusAI server sidecar
        working-directory: frontend/client
        run: bash scripts/build-sidecar.sh

      # ============ 6. Verify sidecar binary exists ============
      - name: ✅ Verify sidecar binary
        working-directory: frontend/client
        shell: bash
        run: |
          echo "Sidecar dist contents:"
          ls -la sidecar/dist/ || true
          if [ ! -f sidecar/dist/hakusai-server ] && [ ! -f sidecar/dist/hakusai-server.exe ]; then
            echo "⚠️  Warning: sidecar binary not found. Build will continue without bundled Python backend."
            echo "    Users will need to run HakusAI server separately."
          else
            echo "✓ Sidecar binary present"
          fi

      # ============ 7. Install npm dependencies ============
      - name: 📥 Install npm dependencies
        working-directory: frontend/client
        run: npm ci

      # ============ 8. Generate icon set ============
      - name: 🎨 Generate icon set
        working-directory: frontend/client
        run: python3 scripts/make-icon.py

      # ============ 9. Build & package Electron app ============
      - name: 📦 Build Electron app (${{ matrix.platform }})
        working-directory: frontend/client
        run: npm run dist:${{ matrix.platform }}
        env:
          # GitHub Actions 默认 CI=true, electron-builder 会据此启用更详细的日志
          CI: true
          # macOS 签名 (可选 — 没有证书就跳过, 用户首次启动需右键打开)
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Linux: 关掉 fpm 的某些坑
          USE_SYSTEM_FPM: false

      # ============ 10. List build artifacts ============
      - name: 📋 List build artifacts
        working-directory: frontend/client
        shell: bash
        run: |
          echo "=== release/ contents ==="
          ls -la release/ || true
          echo ""
          echo "=== File sizes ==="
          du -h release/* 2>/dev/null || true

      # ============ 11. Upload artifacts to Actions ============
      # 即使没推 tag, 也能从 Actions 页面下载产物
      #
      # 关键参数:
      #   retention-days: 1     — GitHub 免费账户只有 500 MB artifact 配额,
      #                           retention 设 1 天 (最低) 让旧产物快速过期
      #                           再加上 cleanup job 主动清理, 永不超配额
      #   compression-level: 0  — exe/dmg/AppImage 本身已经是压缩格式 (NSIS
      #                           LZMA / DMG UDZO / AppImage squashfs), 再用
      #                           gzip 压一遍是浪费 CPU 不会减小体积
      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            frontend/client/release/*.exe
            frontend/client/release/*.dmg
            frontend/client/release/*.AppImage
            frontend/client/release/*.deb
            frontend/client/release/*.snap
            frontend/client/release/*.blockmap
            frontend/client/release/latest*.yml
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

  # =====================================================================
  # Release job — 只在推 tag 时运行
  # 等所有平台构建完成后, 把产物汇总到 GitHub Release
  # =====================================================================
  release:
    name: 📢 Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: 📋 List downloaded artifacts
        run: |
          echo "=== All downloaded artifacts ==="
          find artifacts -type f | sort
          echo ""
          echo "=== Moving to release/ ==="
          mkdir -p release
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.snap" -o -name "*.blockmap" -o -name "latest*.yml" \) -exec cp -v {} release/ \;
          echo ""
          echo "=== release/ contents ==="
          ls -la release/

      - name: 📢 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HakusAI ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/*
          body: |
            # HakusAI Desktop Client ${{ github.ref_name }}

            ## 📦 下载

            | 平台 | 文件 | 说明 |
            |---|---|---|
            | **Windows** | `HakusAI-Setup-*.exe` | NSIS 安装程序, 双击即装 |
            | **macOS (Intel)** | `HakusAI-*-x64.dmg` | Intel Mac |
            | **macOS (Apple Silicon)** | `HakusAI-*-arm64.dmg` | M1/M2/M3 Mac |
            | **Linux** | `HakusAI-*.AppImage` | 直接运行, 无需安装 |
            | **Linux** | `hakusai-client_*.deb` | Debian/Ubuntu 安装包 |

            ## ✨ 特性

            - 🎨 Cherry Studio 风格 UI, 暗色主题
            - 🤖 完整 AgentEvent 协议支持 (流式文本, 工具调用, 思维链)
            - 💬 多会话管理, 本地持久化
            - 🔌 内嵌 Python 后端 (sidecar), **开箱即用, 无需额外配置**
            - 📝 Markdown 渲染 + 代码高亮
            - 🛠️ 可视化工具调用卡片
            - 🔧 **新**: 24 个内置工具 (含 git_diff / apply_patch / todo_write)
            - 🛡️ **新**: 权限系统默认 ASK, 双层防御 (.aws/credentials / rm -rf / 永远拒绝)
            - 🔍 **新**: Grep 工具改用 ripgrep (大仓库毫秒级搜索)

            ## 🚀 使用

            1. 下载对应平台的安装包
            2. 安装并启动
            3. 在「设置 → 连接」里配置你的 LLM API Key (DeepSeek / GLM / Qwen 等)
            4. 开始对话

            > 💡 macOS 用户首次启动如果提示"无法验证开发者", 请右键 → 打开

            ## 📝 完整变更日志

            见下方自动生成的 Release Notes。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
