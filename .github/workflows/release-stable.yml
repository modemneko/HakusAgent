# 稳定版发布：手动触发，构建桌面端 + HakusCLI 全部产物、签名、生成
# latest.json 并发布到 GitHub。
#
# 与 build-all.yml 的区别：
#   - build-all 只发 `nightly` 预发布（用户手动下载，不参与自动更新）
#   - 本工作流发布固定 tag `stable`，是应用内「检查更新」读取的通道
#
# 产物范围与 nightly 对齐：桌面端（含品牌安装器）、HakusCLI 六平台、
# Android APK。nightly 有什么，stable 就发什么。
#
# 为什么用固定 tag 而不是 v* 版本 tag：客户端把
# `releases/download/stable/latest.json` 烘焙进二进制，固定 tag 让清单地址
# 长期稳定，不必每次发版都改客户端配置。
#
# 前置条件（仓库 Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY           更新签名私钥（必需，缺失则无法产出 .sig）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥密码（生成时未设密码则留空）
#
# 触发：Actions → release-stable → Run workflow，输入要发布的版本号。

name: release-stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号（须与 tauri.conf.json 的 version 一致，例如 0.3.0）'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  STABLE_TAG: stable

jobs:
  desktop:
    name: desktop-${{ matrix.artifact }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: windows
            args: ""
          - platform: macos-latest
            artifact: macos-arm64
            args: "--target aarch64-apple-darwin"
          - platform: macos-14
            artifact: macos-x64
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            artifact: linux
            args: ""
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-14' && 'x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify every version declaration matches
        shell: bash
        run: |
          # Four files declare a version and all of them feed user-visible
          # output: the app's updater comparison, the NSIS installer's bundle
          # name, and the branded installer's Add/Remove Programs entry. A
          # partial bump ships a release whose parts disagree about what
          # version it is, so every source is checked up front.
          expected="${{ inputs.version }}"
          fail=0
          check() {
            local label="$1" actual="$2"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$label is '$actual' but the workflow was given '$expected'"
              fail=1
            else
              echo "ok: $label = $actual"
            fi
          }
          check "desktop-tauri/tauri.conf.json" \
            "$(node -p "require('./HakusAgent/frontend/desktop-tauri/src-tauri/tauri.conf.json').version")"
          check "desktop-tauri/Cargo.toml" \
            "$(grep -m1 '^version' HakusAgent/frontend/desktop-tauri/src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          check "installer/tauri.conf.json" \
            "$(node -p "require('./HakusAgent/frontend/installer/src-tauri/tauri.conf.json').version")"
          check "installer/Cargo.toml" \
            "$(grep -m1 '^version' HakusAgent/frontend/installer/src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          exit $fail

      - name: Install frontend dependencies
        working-directory: HakusAgent/frontend/desktop-tauri
        run: npm ci

      - name: Verify signing secret is configured
        # shell: bash is required — without it the Windows runner falls back to
        # PowerShell, where the bash test below is not evaluated and the guard
        # misfires (it reported "not set" for a secret that was present).
        shell: bash
        # Fail here rather than after a 15-minute build: a missing key does not
        # error at build time (the bundler just skips signing), so the only
        # symptom would be absent .sig files discovered much later.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Add it under Settings / Secrets and variables / Actions. Without it the updater artifacts cannot be signed and no update can ever be installed."
            exit 1
          fi
          echo "signing key present (${#TAURI_SIGNING_PRIVATE_KEY} chars)"

      - name: Build Tauri app (signed)
        working-directory: HakusAgent/frontend/desktop-tauri
        # createUpdaterArtifacts is enabled in tauri.conf.json, so the bundler
        # emits the updater bundle plus its .sig sidecar.
        #
        # TAURI_SIGNING_PRIVATE_KEY_PASSWORD must be set even when the key has
        # no password. Verified locally: with the variable simply absent, the
        # bundler logs "Decrypting updater signing key, expect a prompt for
        # password", skips signing WITHOUT failing, and produces no .sig — the
        # build looks green and the breakage only surfaces at publish time.
        # An explicitly empty string makes it sign with an empty password.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build ${{ matrix.args }}

      - name: Collect updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stable-assets
          base="HakusAgent/frontend/desktop-tauri/src-tauri/target"
          # Updater bundles live under the target triple's bundle dir on
          # cross-compiled macOS builds, so search the whole tree.
          find "$base" -type f \( \
            -name '*.sig' -o \
            -name '*-setup.exe' -o \
            -name '*.app.tar.gz' -o \
            -name '*.AppImage' \
          \) -exec cp -v {} stable-assets/ \;
          echo "--- collected ---"
          ls -la stable-assets/
          if ! ls stable-assets/*.sig >/dev/null 2>&1; then
            echo "::error::No .sig files produced. Set TAURI_SIGNING_PRIVATE_KEY and make sure bundle.createUpdaterArtifacts is true."
            exit 1
          fi
          # Drop signatures whose bundle was not collected (.deb/.rpm/.msi are
          # signed by the bundler but are not self-updating, so the updater
          # never reads them). Uploading them wastes mirror bandwidth and makes
          # it look like a platform shipped when only its signature did.
          for sig in stable-assets/*.sig; do
            bundle="$(basename "$sig" .sig)"
            if [ ! -f "stable-assets/$bundle" ]; then
              echo "dropping orphan signature: $bundle.sig (no matching bundle)"
              rm -f "$sig"
            fi
          done
          echo "--- after pruning orphans ---"
          ls -la stable-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: stable-${{ matrix.artifact }}
          path: stable-assets/*
          if-no-files-found: error

  # HakusCLI — 与 nightly 的 hakuscli job 同一套矩阵与构建命令，保证
  # stable 的产物和 nightly 一一对应。额外的 `hakus-*` 副本是为 CLI 自更新
  # 准备的：它按 `hakus-{os}-{arch}` 约定查找资源（cli/src/update.rs），
  # 只看正式 release，因此只在 stable 通道发布时才有意义。
  hakuscli:
    name: cli-${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cross: false
          - asset: linux-arm64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: true
          - asset: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            cross: false
          - asset: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
            cross: true
          - asset: windows-x64.exe
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
          - asset: windows-arm64.exe
            os: windows-latest
            target: aarch64-pc-windows-msvc
            cross: true
          - asset: android-arm64.tar.gz
            os: ubuntu-22.04
            target: aarch64-linux-android
            android: true
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: nttld/setup-ndk@v1
        if: matrix.android
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        if: matrix.android
        run: cargo install cargo-ndk --locked

      - name: Install system deps (linux native)
        if: matrix.os == 'ubuntu-22.04' && matrix.cross == false && matrix.android != true
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build (Android Bionic)
        if: matrix.android
        working-directory: frontend/terminal
        run: |
          cargo ndk --platform 26 -t arm64-v8a build --release --bin hakuscli
          tar czf hakuscli-android-arm64.tar.gz \
            -C target/aarch64-linux-android/release hakuscli

      - name: Install cross
        if: matrix.cross == true && matrix.android != true
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.cross == true && matrix.android != true
        working-directory: frontend/terminal
        run: cross build --release --locked --target ${{ matrix.target }} --bin hakuscli

      - name: Build (native)
        if: matrix.cross == false && matrix.android != true
        working-directory: frontend/terminal
        run: cargo build --release --locked --target ${{ matrix.target }} --bin hakuscli

      - name: Package (unix)
        if: matrix.os != 'windows-latest' && matrix.android != true
        working-directory: frontend/terminal
        run: |
          cp "target/${{ matrix.target }}/release/hakuscli" "hakuscli-${{ matrix.asset }}"
          chmod +x "hakuscli-${{ matrix.asset }}"

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        working-directory: frontend/terminal
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/hakuscli.exe" -Destination "hakuscli-${{ matrix.asset }}"

      # CLI 自更新按 `hakus-*` 命名查找，所以除 hakuscli-* 之外再放一份
      # 同内容的 `hakus-*`。桌面端产物不参与这一步。
      - name: Publish asset under the self-update name
        if: matrix.android != true
        shell: bash
        working-directory: frontend/terminal
        run: |
          set -euo pipefail
          src="hakuscli-${{ matrix.asset }}"
          dst="hakus-${{ matrix.asset }}"
          cp "$src" "$dst"
          echo "self-update asset: $dst"

      - name: Collect CLI assets
        shell: bash
        working-directory: frontend/terminal
        run: |
          set -euo pipefail
          mkdir -p cli-assets
          find . -maxdepth 1 -type f \( -name 'hakuscli-*' -o -name 'hakus-*' \) -exec cp -v {} cli-assets/ \;
          ls -la cli-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: stable-cli-${{ matrix.asset }}
          path: frontend/terminal/cli-assets/*
          if-no-files-found: error

  android:
    name: android-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install frontend dependencies
        working-directory: HakusAgent/frontend/desktop-tauri
        run: npm ci

      - name: Build Android APK
        working-directory: HakusAgent/frontend/desktop-tauri
        run: npx tauri android build --apk --target aarch64

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-assets
          find HakusAgent/frontend/desktop-tauri/src-tauri/gen/android -type f -name '*.apk' -exec cp -v {} apk-assets/ \;
          ls -la apk-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: stable-android-apk
          path: apk-assets/*
          if-no-files-found: error

  publish:
    name: publish-stable
    needs: [desktop, hakuscli, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: _stable
          merge-multiple: true

      - name: Flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stable-assets
          find _stable -type f -exec cp -v {} stable-assets/ \;
          ls -la stable-assets/

      - name: Generate latest.json
        run: |
          node scripts/generate-latest-json.mjs \
            --version "${{ inputs.version }}" \
            --assets-dir stable-assets \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${STABLE_TAG}" \
            --out latest.json

      - name: Publish GitHub stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.STABLE_TAG }}
          name: HakusAI Stable
          # Fixed tag, refreshed each release: the client's endpoint URL is
          # baked into the binary, so the tag must not change per version.
          prerelease: false
          make_latest: true
          files: |
            stable-assets/*
            latest.json

