# HakusAgent 全端构建 — 只出 Actions Artifacts，不发 Release。
#
# 内容：
#   - hakuscli 四端（Linux x64/arm64、macOS arm64/x64、Windows x64/arm64、
#     Android arm64）— 源码 frontend/terminal
#   - 桌面端三平台（Windows NSIS、macOS dmg(app)、Linux deb/AppImage）
#     — 源码 HakusAgent/frontend/desktop-tauri（Tauri 2）
#
# 触发：手动 workflow_dispatch / v* tag。发布 Release 是显式后续动作，
# 本工作流永远只上传 artifacts。
name: build-all

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── HakusCLI（Rust，四端七 target）────────────────────────────
  hakuscli:
    name: hakuscli-${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cross: false
          - asset: linux-arm64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: true
          - asset: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            cross: false
          - asset: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
            cross: true
          - asset: windows-x64.exe
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
          - asset: windows-arm64.exe
            os: windows-latest
            target: aarch64-pc-windows-msvc
            cross: true
          - asset: android-arm64.tar.gz
            os: ubuntu-22.04
            target: aarch64-linux-android
            android: true
    defaults:
      run:
        working-directory: frontend/terminal
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: nttld/setup-ndk@v1
        id: ndk
        if: matrix.android
        with:
          ndk-version: r27c

      - run: cargo install cargo-ndk --locked
        if: matrix.android

      # `libdbus-1` is needed by the opt-in OS keyring backend (keyring ->
      # secret-service -> dbus -> libdbus-sys). It is only compiled on Linux
      # targets, so install the dev package before a native build.
      - name: Install system deps (linux native)
        if: matrix.os == 'ubuntu-22.04' && matrix.cross == false && matrix.android != true
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build (Android Bionic)
        if: matrix.android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android: >-
            --sysroot=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            --target=aarch64-linux-android26
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_android: >-
            --sysroot=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            --target=aarch64-linux-android26
        run: |
          cargo ndk --platform 26 -t arm64-v8a build --release --bin hakuscli
          tar czf hakuscli-android-arm64.tar.gz \
            -C target/aarch64-linux-android/release hakuscli

      - name: Build (cross)
        if: matrix.cross == true && matrix.android != true
        run: |
          cargo install cross --locked
          cross build --release --locked --target ${{ matrix.target }} --bin hakuscli

      - name: Build (native)
        if: matrix.cross == false && matrix.android != true
        run: cargo build --release --locked --target ${{ matrix.target }} --bin hakuscli

      - name: Package (unix)
        if: matrix.os != 'windows-latest' && matrix.android != true
        run: |
          cp "target/${{ matrix.target }}/release/hakuscli" "hakuscli-${{ matrix.asset }}"
          chmod +x "hakuscli-${{ matrix.asset }}"

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/hakuscli.exe" -Destination "hakuscli-${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: hakuscli-${{ matrix.asset }}
          path: frontend/terminal/hakuscli-*
          if-no-files-found: error

  # ── 桌面端（Tauri 2，三平台）──────────────────────────────────
  desktop:
    name: desktop-${{ matrix.artifact }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: windows
            args: ""
          - platform: macos-latest # arm64 (M 系列)
            artifact: macos-arm64
            args: "--target aarch64-apple-darwin"
          - platform: macos-14 # x64 (Intel)
            artifact: macos-x64
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            artifact: linux
            args: ""
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-14' && 'x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: HakusAgent/frontend/desktop-tauri
        run: npm ci

      - name: Build Tauri app
        working-directory: HakusAgent/frontend/desktop-tauri
        run: npx tauri build ${{ matrix.args }}

      - name: Upload bundles (windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            HakusAgent/frontend/desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
            HakusAgent/frontend/desktop-tauri/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload bundles (macOS)
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: |
            HakusAgent/frontend/desktop-tauri/src-tauri/target/*/release/bundle/dmg/*.dmg
            HakusAgent/frontend/desktop-tauri/src-tauri/target/*/release/bundle/macos/*.app
          if-no-files-found: warn

      - name: Upload bundles (linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            HakusAgent/frontend/desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
            HakusAgent/frontend/desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  # ── Android client (Tauri 2, arm64 APK) ─────────────────────────
  # Android is a network client. It packages the React UI and connects to a
  # separately running HakusAI HTTP server configured in the app settings.
  android:
    name: android-apk-${{ matrix.asset }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: arm64
            rust-target: aarch64-linux-android
            tauri-target: aarch64
          - asset: x86_64
            rust-target: x86_64-linux-android
            tauri-target: x86_64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: HakusAgent/frontend/desktop-tauri
        run: npm ci

      - name: Initialize Android project
        working-directory: HakusAgent/frontend/desktop-tauri
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: npx tauri android init --ci --skip-targets-install

      - name: Apply branded Android icons
        working-directory: HakusAgent/frontend/desktop-tauri
        shell: bash
        run: |
          set -euo pipefail
          source_icons="src-tauri/icons/android"
          generated_resources="src-tauri/gen/android/app/src/main/res"
          test -f "$source_icons/mipmap-hdpi/ic_launcher.png"
          test -d "$generated_resources"
          cp -R "$source_icons/." "$generated_resources/"

      - name: Permit LAN HTTP HakusAI servers
        working-directory: HakusAgent/frontend/desktop-tauri
        shell: bash
        run: |
          manifest=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          if grep -q 'android:usesCleartextTraffic=' "$manifest"; then
            sed -i 's/android:usesCleartextTraffic="[^"]*"/android:usesCleartextTraffic="true"/' "$manifest"
          else
            sed -i 's#<application #<application android:usesCleartextTraffic="true" #' "$manifest"
          fi
          if ! grep -q 'android.permission.INTERNET' "$manifest"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$manifest"
          fi

      - name: Build Android APK
        working-directory: HakusAgent/frontend/desktop-tauri
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android: >-
            --sysroot=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            --target=aarch64-linux-android26
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_android: >-
            --sysroot=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            --target=aarch64-linux-android26
          BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android: >-
            --sysroot=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            --target=x86_64-linux-android26
          BINDGEN_EXTRA_CLANG_ARGS_x86_64_unknown_linux_android: >-
            --sysroot=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            --target=x86_64-linux-android26
        run: npx tauri android build --ci --apk --split-per-abi --target ${{ matrix.tauri-target }}

      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/hakusai-release.keystore"

          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required when using a release keystore}"
            : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required when using a release keystore}"
            : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required when using a release keystore}"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            signing_password="$ANDROID_KEYSTORE_PASSWORD"
            key_alias="$ANDROID_KEY_ALIAS"
            key_password="$ANDROID_KEY_PASSWORD"
          else
            echo "::warning::Android signing secrets are not configured; using a temporary CI signing key. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD for upgradeable release APKs."
            key_alias="hakusai-ci"
            signing_password="android"
            key_password="android"
            keytool -genkeypair -v \
              -keystore "$keystore" \
              -storepass "$signing_password" \
              -alias "$key_alias" \
              -keypass "$key_password" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=HakusAI CI, OU=Android, O=HakusAI, C=CN"
          fi

          {
            echo "ANDROID_KEYSTORE_PATH=$keystore"
            echo "ANDROID_SIGNING_PASSWORD=$signing_password"
            echo "ANDROID_KEY_ALIAS=$key_alias"
            echo "ANDROID_KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"

      - name: Align and sign Android APK
        working-directory: HakusAgent/frontend/desktop-tauri
        shell: bash
        run: |
          set -euo pipefail
          apk_root="src-tauri/gen/android/app/build/outputs/apk"
          signed_dir="$apk_root/signed"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$signed_dir"

          mapfile -t unsigned_apks < <(find "$apk_root" -type f -name '*-unsigned.apk' -print)
          if [[ "${#unsigned_apks[@]}" -eq 0 ]]; then
            echo "No unsigned release APK was produced under $apk_root"
            find "$apk_root" -type f -name '*.apk' -print || true
            exit 1
          fi

          for unsigned_apk in "${unsigned_apks[@]}"; do
            filename="$(basename "$unsigned_apk")"
            base="${filename%-unsigned.apk}"
            aligned_apk="$RUNNER_TEMP/${base}-aligned.apk"
            signed_apk="$signed_dir/${base}-signed.apk"

            "$build_tools/zipalign" -f -p 4 "$unsigned_apk" "$aligned_apk"
            "$build_tools/apksigner" sign \
              --ks "$ANDROID_KEYSTORE_PATH" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:$ANDROID_SIGNING_PASSWORD" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --out "$signed_apk" \
              "$aligned_apk"
            "$build_tools/apksigner" verify --verbose "$signed_apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: hakusai-android-${{ matrix.asset }}-apk
          path: HakusAgent/frontend/desktop-tauri/src-tauri/gen/android/app/build/outputs/apk/signed/*.apk
          if-no-files-found: error
