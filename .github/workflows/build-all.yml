# HakusAgent 全端构建 + 自动发布 nightly Release。
#
# 触发：仅 workflow_dispatch（手动）。普通 push / 普通 tag 不会触发。
# 产物：
#   - hakuscli 四端
#   - 桌面端 Windows / macOS / Linux
#   - Windows 品牌安装器（内嵌 app payload）
#   - Android APK
#
# 发布：更新/创建固定 tag `nightly` 与同名 prerelease，不带数字版本号。

name: build-all

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NIGHTLY_TAG: nightly

jobs:
  hakuscli:
    name: hakuscli-${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cross: false
          - asset: linux-arm64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: true
          - asset: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            cross: false
          - asset: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
            cross: true
          - asset: windows-x64.exe
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
          - asset: windows-arm64.exe
            os: windows-latest
            target: aarch64-pc-windows-msvc
            cross: true
          - asset: android-arm64.tar.gz
            os: ubuntu-22.04
            target: aarch64-linux-android
            android: true
    defaults:
      run:
        working-directory: frontend/terminal
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: nttld/setup-ndk@v1
        id: ndk
        if: matrix.android
        with:
          ndk-version: r27c

      - run: cargo install cargo-ndk --locked
        if: matrix.android

      - name: Install system deps (linux native)
        if: matrix.os == 'ubuntu-22.04' && matrix.cross == false && matrix.android != true
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build (Android Bionic)
        if: matrix.android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android: >-
            --sysroot=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            --target=aarch64-linux-android26
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_android: >-
            --sysroot=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            --target=aarch64-linux-android26
        run: |
          cargo ndk --platform 26 -t arm64-v8a build --release --bin hakuscli
          tar czf hakuscli-android-arm64.tar.gz \
            -C target/aarch64-linux-android/release hakuscli

      - name: Build (cross)
        if: matrix.cross == true && matrix.android != true
        run: |
          cargo install cross --locked
          cross build --release --locked --target ${{ matrix.target }} --bin hakuscli

      - name: Build (native)
        if: matrix.cross == false && matrix.android != true
        run: cargo build --release --locked --target ${{ matrix.target }} --bin hakuscli

      - name: Package (unix)
        if: matrix.os != 'windows-latest' && matrix.android != true
        run: |
          cp "target/${{ matrix.target }}/release/hakuscli" "hakuscli-${{ matrix.asset }}"
          chmod +x "hakuscli-${{ matrix.asset }}"

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/hakuscli.exe" -Destination "hakuscli-${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: hakuscli-${{ matrix.asset }}
          path: frontend/terminal/hakuscli-*
          if-no-files-found: error

  desktop:
    name: desktop-${{ matrix.artifact }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: windows
            args: ""
          - platform: macos-latest
            artifact: macos-arm64
            args: "--target aarch64-apple-darwin"
          - platform: macos-14
            artifact: macos-x64
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            artifact: linux
            args: ""
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-14' && 'x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: HakusAgent/frontend/desktop-tauri
        run: npm ci

      - name: Build Tauri app
        working-directory: HakusAgent/frontend/desktop-tauri
        # bundle.createUpdaterArtifacts is enabled, which makes the bundler
        # SIGN the updater artifacts. With a pubkey configured in
        # plugins.updater but no private key in the environment, the bundler
        # hard-fails ("A public key has been found, but no private key"), so
        # the secrets must be present for nightly builds too. The signatures
        # are unused by the nightly channel; they exist so the build passes.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build ${{ matrix.args }}

      - name: Stage installer payload (windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "repo=$(Get-Location)"
          ./scripts/package-installer-payload.ps1
          if (-not (Test-Path "HakusAgent/frontend/installer/src-tauri/payload/app-payload.zip")) {
            throw "app-payload.zip was not produced"
          }
          $zip = Get-Item "HakusAgent/frontend/installer/src-tauri/payload/app-payload.zip"
          $zipMb = [math]::Round($zip.Length/1MB,1)
          Write-Host "app-payload.zip = $zipMb MB"
          if ($zip.Length -gt 150MB) {
            throw "app-payload.zip is too large ($zipMb MB) — packaging likely included build caches"
          }

      - name: Build branded installer (windows)
        if: matrix.platform == 'windows-latest'
        working-directory: HakusAgent/frontend/installer
        run: |
          npm ci || npm install
          npx tauri build --no-bundle

      - name: Collect Windows release assets
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $out = "release-assets"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # Traditional NSIS app installer (optional / enterprise)
          Get-ChildItem "HakusAgent/frontend/desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName (Join-Path $out "HakusAI-nightly-windows-x64-setup.exe") -Force }

          # Branded installer is a portable folder (exe + payload) shipped as
          # one zip — double-click the extracted exe to open the wizard
          # directly (no second NSIS install step).
          $instExe = Get-ChildItem "HakusAgent/frontend/installer/src-tauri/target/release/*.exe" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch 'build-script' } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $instExe) {
            Write-Host "release dir:"
            Get-ChildItem "HakusAgent/frontend/installer/src-tauri/target/release" -ErrorAction SilentlyContinue | Select-Object Name,Length
            throw "Installer exe not found"
          }
          $stageInst = Join-Path $env:TEMP "hakus-installer-stage"
          if (Test-Path $stageInst) { Remove-Item $stageInst -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stageInst | Out-Null
          Copy-Item $instExe.FullName (Join-Path $stageInst "HakusAI-Installer.exe") -Force
          $payloadSrc = "HakusAgent/frontend/installer/src-tauri/payload/app-payload.zip"
          if (-not (Test-Path $payloadSrc)) { throw "payload zip missing: $payloadSrc" }
          New-Item -ItemType Directory -Force -Path (Join-Path $stageInst "payload") | Out-Null
          Copy-Item $payloadSrc (Join-Path $stageInst "payload\app-payload.zip") -Force
          $instZip = Join-Path $out "HakusAI-Installer-nightly-windows-x64.zip"
          Compress-Archive -Path (Join-Path $stageInst "*") -DestinationPath $instZip -Force
          Write-Host "Installer zip: $instZip ($([math]::Round((Get-Item $instZip).Length/1MB,1)) MB) from $($instExe.Name)"

          Get-ChildItem $out | Format-Table Name, Length
          if (-not (Get-ChildItem $out -Filter *.exe)) { throw "No Windows release assets collected" }

      - name: Collect macOS release assets
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          mkdir -p release-assets
          if [ "${{ matrix.artifact }}" = "macos-arm64" ]; then suffix="aarch64"; else suffix="x64"; fi
          find HakusAgent/frontend/desktop-tauri/src-tauri/target -path "*/bundle/dmg/*.dmg" -print0 |
            while IFS= read -r -d '' f; do
              cp "$f" "release-assets/HakusAI-nightly-macos-${suffix}.dmg"
            done
          ls -la release-assets || true

      - name: Collect Linux release assets
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p release-assets
          find HakusAgent/frontend/desktop-tauri/src-tauri/target/release/bundle/deb -name '*.deb' -print0 2>/dev/null |
            while IFS= read -r -d '' f; do cp "$f" "release-assets/HakusAI-nightly-amd64.deb"; done
          find HakusAgent/frontend/desktop-tauri/src-tauri/target/release/bundle/appimage -name '*.AppImage' -print0 2>/dev/null |
            while IFS= read -r -d '' f; do cp "$f" "release-assets/HakusAI-nightly-amd64.AppImage"; done
          ls -la release-assets || true

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}-assets
          path: release-assets/*
          if-no-files-found: warn

      # Keep raw job artifacts for debugging; do not publish payload zip.
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows-latest'
        with:
          name: desktop-windows-raw
          path: |
            HakusAgent/frontend/desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
            HakusAgent/frontend/installer/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  android:
    name: android-apk-${{ matrix.asset }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: arm64
            rust-target: aarch64-linux-android
            tauri-target: aarch64
          - asset: x86_64
            rust-target: x86_64-linux-android
            tauri-target: x86_64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: HakusAgent/frontend/desktop-tauri
        run: npm ci

      - name: Initialize Android project
        working-directory: HakusAgent/frontend/desktop-tauri
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: npx tauri android init --ci --skip-targets-install

      - name: Apply branded Android icons
        working-directory: HakusAgent/frontend/desktop-tauri
        shell: bash
        run: |
          set -euo pipefail
          source_icons="src-tauri/icons/android"
          generated_resources="src-tauri/gen/android/app/src/main/res"
          test -f "$source_icons/mipmap-hdpi/ic_launcher.png"
          test -d "$generated_resources"
          cp -R "$source_icons/." "$generated_resources/"

      - name: Permit LAN HTTP HakusAI servers
        working-directory: HakusAgent/frontend/desktop-tauri
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("src-tauri/gen/android/app/src/main/AndroidManifest.xml")
          m = p.read_text(encoding="utf-8")
          if 'android:usesCleartextTraffic' in m:
              m = re.sub(r'android:usesCleartextTraffic="[^"]*"', 'android:usesCleartextTraffic="true"', m)
          else:
              m = m.replace('<application', '<application\n        android:usesCleartextTraffic="true"', 1)
          if 'android.permission.INTERNET' not in m:
              m = re.sub(r'(<application\b[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.INTERNET" />', m, count=1)
          if 'android:allowBackup' in m:
              m = re.sub(r'android:allowBackup="[^"]*"', 'android:allowBackup="false"', m)
          else:
              m = m.replace('<application', '<application\n        android:allowBackup="false"', 1)
          p.write_text(m, encoding="utf-8")
          print("manifest patched")
          PY
          grep -q 'android:usesCleartextTraffic="true"' src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Build Android APK
        working-directory: HakusAgent/frontend/desktop-tauri
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android: >-
            --sysroot=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            --target=aarch64-linux-android26
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_android: >-
            --sysroot=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            --target=aarch64-linux-android26
          BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android: >-
            --sysroot=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            --target=x86_64-linux-android26
        run: npx tauri android build --ci --apk --split-per-abi --target ${{ matrix.tauri-target }}

      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/hakusai-release.keystore"

          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required when using a release keystore}"
            : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required when using a release keystore}"
            : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required when using a release keystore}"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            signing_password="$ANDROID_KEYSTORE_PASSWORD"
            key_alias="$ANDROID_KEY_ALIAS"
            key_password="$ANDROID_KEY_PASSWORD"
          else
            echo "::warning::Android signing secrets are not configured; using a temporary CI signing key."
            key_alias="hakusai-ci"
            signing_password="android"
            key_password="android"
            keytool -genkeypair -v \
              -keystore "$keystore" \
              -storepass "$signing_password" \
              -alias "$key_alias" \
              -keypass "$key_password" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=HakusAI CI, OU=Android, O=HakusAI, C=CN"
          fi

          {
            echo "ANDROID_KEYSTORE_PATH=$keystore"
            echo "ANDROID_SIGNING_PASSWORD=$signing_password"
            echo "ANDROID_KEY_ALIAS=$key_alias"
            echo "ANDROID_KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"

      - name: Align and sign Android APK
        working-directory: HakusAgent/frontend/desktop-tauri
        shell: bash
        run: |
          set -euo pipefail
          apk_root="src-tauri/gen/android/app/build/outputs/apk"
          signed_dir="$apk_root/signed"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$signed_dir"

          mapfile -t unsigned_apks < <(find "$apk_root" -type f -name '*-unsigned.apk' -print)
          if [[ "${#unsigned_apks[@]}" -eq 0 ]]; then
            echo "No unsigned release APK was produced under $apk_root"
            find "$apk_root" -type f -name '*.apk' -print || true
            exit 1
          fi

          for unsigned_apk in "${unsigned_apks[@]}"; do
            filename="$(basename "$unsigned_apk")"
            base="${filename%-unsigned.apk}"
            aligned_apk="$RUNNER_TEMP/${base}-aligned.apk"
            signed_apk="$signed_dir/${base}-signed.apk"

            "$build_tools/zipalign" -f -p 4 "$unsigned_apk" "$aligned_apk"
            "$build_tools/apksigner" sign \
              --ks "$ANDROID_KEYSTORE_PATH" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:$ANDROID_SIGNING_PASSWORD" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --out "$signed_apk" \
              "$aligned_apk"
            "$build_tools/apksigner" verify --verbose "$signed_apk"
          done

      - name: Collect Android release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find HakusAgent/frontend/desktop-tauri/src-tauri/gen/android/app/build/outputs/apk/signed -name '*-signed.apk' -print0 |
            while IFS= read -r -d '' f; do
              cp "$f" "release-assets/HakusAI-nightly-android-${{ matrix.asset }}.apk"
            done
          ls -la release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.asset }}-assets
          path: release-assets/*
          if-no-files-found: error

  publish-nightly:
    needs: [hakuscli, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: _nightly
          merge-multiple: true

      - name: Prepare nightly assets
        shell: bash
        run: |
          mkdir -p dist
          # Desktop / installer / android collected assets
          find _nightly -type f \( \
            -name 'HakusAI-nightly-*' -o \
            -name 'HakusAI-Installer-nightly-*' \
          \) -exec cp -v {} dist/ \;
          # CLI binaries
          find _nightly -type f -name 'hakuscli-*' -exec cp -v {} dist/ \;
          # Never publish raw payload zip
          rm -f dist/app-payload.zip
          ls -lah dist
          count=$(ls dist | wc -l)
          if [ "$count" -lt 5 ]; then
            echo "Expected more nightly assets, got only $count"
            ls -laR _nightly | head -100
            exit 1
          fi

      - name: Compose nightly notes
        shell: bash
        run: |
          SHORT="${GITHUB_SHA::7}"
          DATE_UTC="$(date -u +'%Y-%m-%d %H:%M UTC')"
          cat > notes.md <<EOF
          ## HakusAI Nightly

          > Rolling prerelease — always the latest successful \`build-all\` run.
          > Built from commit \`${GITHUB_SHA}\` (${SHORT})
          > Date: ${DATE_UTC}

          ### Downloads / 下载
          | Asset | Platform |
          | --- | --- |
          | \`HakusAI-Installer-nightly-windows-x64.zip\` | Windows 品牌安装向导（解压后运行 exe） |
          | \`HakusAI-nightly-windows-x64-setup.exe\` | Windows NSIS 静默友好包 |
          | \`HakusAI-nightly-macos-aarch64.dmg\` | macOS Apple Silicon |
          | \`HakusAI-nightly-macos-x64.dmg\` | macOS Intel |
          | \`HakusAI-nightly-amd64.AppImage\` / \`.deb\` | Linux x64 |
          | \`HakusAI-nightly-android-*.apk\` | Android |
          | \`hakuscli-*\` | CLI |

          ### Notes / 说明
          - 中英文教程：[\`docs/RELEASE_GUIDE.zh-en.md\`](https://github.com/${{ github.repository }}/blob/${GITHUB_SHA}/docs/RELEASE_GUIDE.zh-en.md)
          - Nightly **不会**被正式版自动更新安装，需手动下载。
          - Workflow: \`build-all\` run \`${{ github.run_id }}\`
          EOF

      - name: Publish rolling nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: HakusAI Nightly
          body_path: notes.md
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: dist/*
          # Portable installer needs its payload beside it at runtime when
          # resources are not embedded; also ship payload for the branded exe.
          # (payload zip is internal — not user-facing download page primary)
