name: Quality Gates

# =====================================================================
# HakusAI CI/CD 质量门禁
# =====================================================================
#
# 触发方式:
#   1. PR 到 main/develop 分支 → 运行全部质量检查
#   2. 推送到 main 分支 → 运行全部质量检查 (保护主分支)
#
# 检查项:
#   - Python 后端: ruff lint + format check + mypy type check
#   - 前端: TypeScript type check + build 验证
#   - E2E: Playwright 端到端测试 (可选)
#
# =====================================================================

on:
  pull_request:
    branches: [main, develop, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =====================================================================
  # Python 后端质量检查
  # =====================================================================
  backend-quality:
    name: 🐍 Backend Quality (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🔧 Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy isort

      - name: 🔍 Ruff Lint
        run: |
          ruff check src/ hakus/ --output-format=github

      - name: 🎨 Ruff Format Check
        run: |
          ruff format --check src/ hakus/

      - name: 🔎 Import Sorting Check
        run: |
          isort --check-only --diff src/ hakus/

      - name: 📝 Mypy Type Check
        continue-on-error: true  # 暂时允许类型检查失败，逐步修复
        run: |
          mypy src/hakusai_server/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --show-error-codes \
            --error-summary

  # =====================================================================
  # 前端质量检查
  # =====================================================================
  frontend-quality:
    name: 🎨 Frontend Quality (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/client/package-lock.json

      - name: 📥 Install npm dependencies
        working-directory: frontend/client
        run: npm ci

      - name: 🔍 TypeScript Type Check
        working-directory: frontend/client
        run: npx tsc --noEmit --pretty

      - name: 🏗️ Build Verification
        working-directory: frontend/client
        run: npm run build
        env:
          CI: true

      - name: 📊 Build Output Size Check
        working-directory: frontend/client
        run: |
          echo "Build output size:"
          du -sh release/ 2>/dev/null || du -sh dist/ 2>/dev/null || echo "No build output found"

  # =====================================================================
  # Playwright E2E 测试 (可选，仅在 PR 时运行)
  # =====================================================================
  e2e-tests:
    name: 🧪 E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'  # 仅在 PR 时运行
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/client/package-lock.json

      - name: 📥 Install npm dependencies
        working-directory: frontend/client
        run: npm ci

      - name: 🎭 Install Playwright browsers
        working-directory: frontend/client
        run: npx playwright install --with-deps

      - name: 🧪 Run E2E Tests
        working-directory: frontend/client
        run: npx playwright test || true  # 暂不阻塞合并
        env:
          CI: true

      - name: 📊 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/client/playwright-report/
          retention-days: 7

  # =====================================================================
  # 巨型文件检测 (防止代码膨胀)
  # =====================================================================
  file-size-check:
    name: 📏 File Size Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Check for oversized files
        run: |
          echo "📏 Checking for files exceeding 500 lines..."
          
          # 找出超过 500 行的 Python 文件
          OVERSIZED=$(find . -name "*.py" -not -path "./.git/*" -not -path "./node_modules/*" \
            -not -path "./tts_engines/*" -not -path "./venv/*" -not -path "./.venv/*" \
            -exec wc -l {} \; | awk '$1 > 500 {print}')
          
          if [ -n "$OVERSIZED" ]; then
            echo "⚠️ Warning: Found files exceeding 500 lines:"
            echo "$OVERSIZED"
            echo ""
            echo "Consider splitting large files. See REFACTOR_PLAN.md for guidance."
            exit 0  # 仅警告，不阻塞
          else
            echo "✅ All Python files are under 500 lines"
          fi

      - name: 📊 Report largest files
        run: |
          echo "📊 Top 20 largest Python files by line count:"
          find . -name "*.py" -not -path "./.git/*" -not -path "./node_modules/*" \
            -not -path "./tts_engines/*" -not -path "./venv/*" -not -path "./.venv/*" \
            -exec wc -l {} \; | sort -rn | head -20

  # =====================================================================
  # 安全扫描 (依赖漏洞检查)
  # =====================================================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔒 Check Python dependencies for vulnerabilities
        run: |
          pip install safety
          if [ -f requirements.txt ]; then
            safety check -r requirements.txt || true
          fi
          # 也检查 pyproject.toml 中的依赖
          if [ -f pyproject.toml ]; then
            pip install -e . 2>/dev/null || true
            safety check || true
          fi

      - name: 📦 Audit npm dependencies
        working-directory: frontend/client
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=moderate || true
          fi
