<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HakusAI</title>
    <!--
      Pre-React theme initialization:
      Set 'dark' class on <html> immediately so CSS variables resolve
      to the dark theme BEFORE React mounts. This eliminates the white flash.
      The settings store will call applyTheme() later which may toggle the class
      if the user chose light/system, but by then the splash has already rendered
      with correct dark colors.
    -->
    <style>
      /* Critical CSS: prevent white flash before framework loads */
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        /* Use the dark theme background color directly.
           This matches --background in .dark: hsl(240 5% 10%) ≈ #17171a */
        background-color: #17171a;
        color: #eeeef0;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
