<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hakusai-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
    <title>HakusAI</title>
    <!--
      Pre-React theme initialization (inline, synchronous):
      Resolve the saved theme BEFORE first paint so the <html> element gets the
      correct `.dark` class (or not) and the critical inline <style> below paints
      the right background/text color. This eliminates BOTH the white flash in
      dark mode AND the "white text on white bg" invisibility bug in light mode
      (which happened when the hardcoded class="dark" survived past applyTheme()
      because settings.load() failed or was delayed).

      Resolution order: electron.store is async and not available here, so we
      fall back to localStorage (browser dev mode) or the system preference.
      The settings store's applyTheme() will re-run after mount and is the
      authoritative source — this inline script only prevents the initial flash.
    -->
    <script>
      (function () {
        try {
          var storedLanguage = 'system';
          var languageRaw = localStorage.getItem('hakusai-settings');
          if (languageRaw) {
            var languageParsed = JSON.parse(languageRaw);
            if (languageParsed && (languageParsed.language === 'zh-CN' || languageParsed.language === 'en-US' || languageParsed.language === 'system')) {
              storedLanguage = languageParsed.language;
            }
          }
          var systemLanguages = [];
          if (Array.isArray(navigator.languages)) systemLanguages = systemLanguages.concat(navigator.languages);
          if (navigator.language) systemLanguages.push(navigator.language);
          try { systemLanguages.push(Intl.DateTimeFormat().resolvedOptions().locale); } catch (e) {}
          var resolvedLanguage = storedLanguage === 'system'
            ? (systemLanguages.some(function (value) { return String(value || '').toLowerCase().indexOf('zh') === 0; }) ? 'zh-CN' : 'en-US')
            : storedLanguage;
          document.documentElement.lang = resolvedLanguage;
          var theme = 'system';
          // 1. Try localStorage (browser dev mode / tauri localStorage mirror)
          var raw = localStorage.getItem('hakusai-settings');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && (parsed.theme === 'light' || parsed.theme === 'dark' || parsed.theme === 'system')) {
              theme = parsed.theme;
            }
          }
          // 2. Resolve 'system' to the OS preference
          var resolved = theme === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : theme;
          // 3. Apply the class
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          }
          // NOTE: do NOT set a class for light — :root defaults are light.
        } catch (e) {
          // On any error, default to dark to preserve the original splash look.
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      /* Critical CSS: prevent flash before framework loads.
         The desktop window is TRANSPARENT (rounded corners are painted by
         #root with CSS), so html/body stay transparent and only #root
         carries the themed background. The main window is hidden until the
         native splash fades, so the transparent webview is never visible
         mid-boot; Android keeps an opaque native window background. */
      html, body, #root, #hakus-overlay-root {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        min-height: 100%;
        overflow: hidden;
      }
      html, body {
        background: transparent;
      }
      #hakus-overlay-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      /* Dark theme base text color (background comes from #root) */
      html {
        color: hsl(220 18% 12%);
      }
      html.dark {
        color: hsl(220 10% 96%);
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="hakus-overlay-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
