<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HakusAI</title>
    <!--
      HakusAI native splash — shown by the desktop shell the instant the
      process starts, before the React webview has finished booting.

      Timeline (per Electron-era design):
        0.0s  black window
        0.3s  aurora blobs breathe in (left side, blur ~110px, low saturation)
        0.8s  "HAKUS" wordmark rises into view
        1.0s  "WORKSPACE IS STARTING" appears below
        finish Rust closes this window after the frontend calls finish_splash
              (minimum display enforced Rust-side); fade-out = 480ms

      No JavaScript on purpose — the fade is triggered from Rust via
      `eval("document.documentElement.classList.add('is-fading')")`.
    -->
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      /* The splash window is TRANSPARENT — the rounded frame is drawn here
         so the splash matches the rounded main window shape. */
      body {
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                     "Segoe UI", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .frame {
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        overflow: hidden;
        border-radius: 16px;
        background: #0a0a0d;
      }

      /* Remotion export is the preferred startup animation. The CSS scene
         below remains visible until the asset is ready and acts as the
         offline/slow-device fallback. */
      .motion-splash {
        position: absolute;
        inset: 0;
        z-index: 3;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease-out;
      }
      html.motion-ready .motion-splash { opacity: 1; }
      html.motion-ready .aurora,
      html.motion-ready .vignette,
      html.motion-ready .glass,
      html.motion-ready .stack { opacity: 0; }

      /* ── Aurora field ───────────────────────────────────────────────
         Four huge, heavily blurred, deliberately desaturated glow blobs
         hugging the left half. The right half stays almost untouched so
         the centered text sits on a quiet surface. */
      .aurora {
        position: absolute;
        inset: 0;
        opacity: 0;
        animation: aurora-in 2.2s ease-out 0.3s forwards;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(110px);
        will-change: opacity, transform;
      }
      .blob-purple {
        width: 46vmax; height: 46vmax; left: -16vmax; top: -18vmax;
        background: rgba(118, 94, 240, 0.30);
        animation: drift-a 9s ease-in-out infinite alternate;
      }
      .blob-blue {
        width: 40vmax; height: 40vmax; left: -12vmax; top: 22vmax;
        background: rgba(62, 100, 226, 0.25);
        animation: drift-b 11s ease-in-out infinite alternate;
      }
      .blob-cyan {
        width: 32vmax; height: 32vmax; left: 6vmax; top: 4vmax;
        background: rgba(58, 168, 188, 0.19);
        animation: drift-c 13s ease-in-out infinite alternate;
      }
      .blob-amber {
        width: 24vmax; height: 24vmax; left: 0; top: 42vmax;
        background: rgba(190, 164, 92, 0.15);
        animation: drift-b 15s ease-in-out infinite alternate-reverse;
      }
      @keyframes aurora-in { to { opacity: 1; } }
      @keyframes drift-a { to { transform: translate3d(4vmax, 3vmax, 0) scale(1.08); } }
      @keyframes drift-b { to { transform: translate3d(-3vmax, -4vmax, 0) scale(0.94); } }
      @keyframes drift-c { to { transform: translate3d(3vmax, -3vmax, 0) scale(1.1); } }

      /* Right-side + bottom vignette keeps the center clean and premium. */
      .vignette {
        position: absolute; inset: 0;
        background:
          radial-gradient(120% 130% at 80% 50%, rgba(9, 9, 13, 0.62) 0%, rgba(9, 9, 13, 0) 56%),
          radial-gradient(150% 110% at 50% 125%, rgba(9, 9, 13, 0.45) 0%, rgba(9, 9, 13, 0) 58%);
      }
      /* Frosted-glass film across the whole window — barely visible. */
      .glass {
        position: absolute; inset: 0;
        background: linear-gradient(105deg,
          rgba(255, 255, 255, 0.034) 0%,
          rgba(255, 255, 255, 0.012) 42%,
          rgba(255, 255, 255, 0) 72%);
      }

      /* ── Electron-era center stack ────────────────────────────────── */
      .stack {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 16px;
        text-align: center;
      }
      .mark {
        display: flex;
        width: 80px;
        height: 80px;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(142, 122, 255, 0.52);
        border-radius: 22px;
        background: rgba(142, 122, 255, 0.08);
        color: #aa9cff;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-indent: 0.2em;
        opacity: 0;
        animation: mark-in 520ms ease-out 0.3s forwards;
      }
      .wordmark {
        color: #f4f2ff;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.25em;
        text-indent: 0.25em;
        text-transform: uppercase;
        opacity: 0;
        animation: text-in 520ms ease-out 0.42s forwards;
      }
      .subtitle {
        margin-top: 8px;
        color: rgba(220, 218, 237, 0.72);
        font-size: 10px;
        font-weight: 400;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
        text-transform: uppercase;
        opacity: 0;
        animation: text-in 520ms ease-out 0.54s forwards;
      }

      @keyframes text-in {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes mark-in {
        from { opacity: 0; transform: scale(0.96); }
        to   { opacity: 1; transform: scale(1); }
      }

      /* ── Exit transition (triggered by finish_splash) ─────────────── */
      html.is-fading body {
        opacity: 0;
        transition: opacity 480ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      html.is-fading .aurora,
      html.is-fading .stack {
        animation-play-state: paused;
      }
      @media (prefers-reduced-motion: reduce) {
        .motion-splash { display: none; }
        .aurora, .mark, .wordmark, .subtitle {
          animation-duration: 0.01s !important;
          animation-delay: 0s !important;
          animation-iteration-count: 1 !important;
        }
        html.is-fading body { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <video class="motion-splash" autoplay muted playsinline preload="auto" aria-hidden="true">
        <source src="./motion/hakus-startup.mp4" type="video/mp4" />
      </video>
      <div class="aurora" aria-hidden="true">
        <div class="blob blob-purple"></div>
        <div class="blob blob-blue"></div>
        <div class="blob blob-cyan"></div>
        <div class="blob blob-amber"></div>
      </div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="glass" aria-hidden="true"></div>
      <main class="stack">
        <div class="mark" aria-hidden="true">H</div>
        <div class="copy">
          <div class="wordmark">HAKUS</div>
          <div class="subtitle">WORKSPACE IS STARTING</div>
        </div>
      </main>
    </div>
    <script>
      // Keep native splash startup deterministic if the optional export is
      // unavailable or blocked by a platform WebView.
      const motionSplash = document.querySelector('.motion-splash');
      if (motionSplash) {
        motionSplash.addEventListener('canplay', () => document.documentElement.classList.add('motion-ready'), { once: true });
        motionSplash.addEventListener('error', () => motionSplash.remove(), { once: true });
      }
    </script>
  </body>
</html>
