<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HakusAI</title>
    <!--
      Fullscreen native splash. Rendered by the desktop shell before the
      React webview finishes booting. Rust triggers the fade via
      `document.documentElement.classList.add('is-fading')`.
    -->
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #07070c; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                     "Segoe UI", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .frame {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #07070c;
      }

      .motion-splash {
        position: absolute;
        inset: 0;
        z-index: 3;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease-out;
      }
      html.motion-ready .motion-splash { opacity: 1; }
      html.motion-ready .aurora,
      html.motion-ready .vignette,
      html.motion-ready .glass,
      html.motion-ready .stack,
      html.motion-ready .progress,
      html.motion-ready .scan { opacity: 0; }

      .aurora {
        position: absolute;
        inset: 0;
        opacity: 0;
        animation: aurora-in 2.2s ease-out 0.15s forwards;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        will-change: opacity, transform;
      }
      .blob-purple {
        width: 58vmax; height: 58vmax; left: -18vmax; top: -20vmax;
        background: rgba(118, 94, 240, 0.34);
        animation: drift-a 8s ease-in-out infinite alternate;
      }
      .blob-blue {
        width: 48vmax; height: 48vmax; right: -16vmax; bottom: -18vmax;
        background: rgba(62, 100, 226, 0.28);
        animation: drift-b 10s ease-in-out infinite alternate;
      }
      .blob-cyan {
        width: 36vmax; height: 36vmax; right: 8vmax; top: -8vmax;
        background: rgba(58, 168, 188, 0.18);
        animation: drift-c 12s ease-in-out infinite alternate;
      }
      .blob-amber {
        width: 28vmax; height: 28vmax; left: 18vmax; bottom: -10vmax;
        background: rgba(190, 164, 92, 0.14);
        animation: drift-b 14s ease-in-out infinite alternate-reverse;
      }
      @keyframes aurora-in { to { opacity: 1; } }
      @keyframes drift-a { to { transform: translate3d(5vmax, 4vmax, 0) scale(1.1); } }
      @keyframes drift-b { to { transform: translate3d(-4vmax, -5vmax, 0) scale(0.92); } }
      @keyframes drift-c { to { transform: translate3d(4vmax, -4vmax, 0) scale(1.12); } }

      .scan {
        position: absolute;
        inset: -20%;
        background: linear-gradient(
          115deg,
          transparent 40%,
          rgba(169, 156, 255, 0.05) 48%,
          rgba(255, 255, 255, 0.04) 50%,
          rgba(169, 156, 255, 0.05) 52%,
          transparent 60%
        );
        animation: scan-sweep 4.8s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes scan-sweep {
        0% { transform: translateX(-30%) skewX(-12deg); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(30%) skewX(-12deg); opacity: 0; }
      }

      .vignette {
        position: absolute; inset: 0;
        background:
          radial-gradient(90% 80% at 50% 45%, rgba(7, 7, 12, 0.15) 0%, rgba(7, 7, 12, 0.72) 100%),
          radial-gradient(140% 100% at 50% 120%, rgba(7, 7, 12, 0.55) 0%, rgba(7, 7, 12, 0) 55%);
      }
      .glass {
        position: absolute; inset: 0;
        background: linear-gradient(105deg,
          rgba(255, 255, 255, 0.04) 0%,
          rgba(255, 255, 255, 0.012) 42%,
          rgba(255, 255, 255, 0) 72%);
      }

      .stack {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 18px;
        text-align: center;
        padding-bottom: 4vh;
      }
      .mark-ring {
        position: relative;
        width: 108px;
        height: 108px;
        display: grid;
        place-items: center;
        opacity: 0;
        animation: mark-in 700ms cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
      }
      .mark-ring::before,
      .mark-ring::after {
        content: "";
        position: absolute;
        border-radius: 28px;
        border: 1px solid rgba(169, 156, 255, 0.35);
      }
      .mark-ring::before {
        inset: 0;
        animation: pulse-ring 2.4s ease-out infinite;
      }
      .mark-ring::after {
        inset: 8px;
        border-color: rgba(169, 156, 255, 0.55);
        border-radius: 22px;
      }
      @keyframes pulse-ring {
        0% { transform: scale(1); opacity: 0.7; }
        70% { transform: scale(1.08); opacity: 0; }
        100% { transform: scale(1.08); opacity: 0; }
      }
      .mark {
        display: flex;
        width: 84px;
        height: 84px;
        align-items: center;
        justify-content: center;
        border-radius: 22px;
        background:
          linear-gradient(145deg, rgba(169, 156, 255, 0.22), rgba(169, 156, 255, 0.06));
        border: 1px solid rgba(169, 156, 255, 0.45);
        color: #c4b8ff;
        font-size: 32px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-indent: 0.18em;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.04) inset,
          0 18px 50px rgba(118, 94, 240, 0.28);
        animation: mark-glow 2.8s ease-in-out infinite alternate;
      }
      @keyframes mark-glow {
        from { box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset, 0 18px 50px rgba(118, 94, 240, 0.22); }
        to   { box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset, 0 22px 60px rgba(118, 94, 240, 0.4); }
      }

      .wordmark {
        color: #f4f2ff;
        font-size: clamp(22px, 2.6vw, 28px);
        font-weight: 600;
        letter-spacing: 0.36em;
        text-indent: 0.36em;
        text-transform: uppercase;
        opacity: 0;
        animation: text-in 560ms ease-out 0.38s forwards;
      }
      .subtitle {
        margin-top: 2px;
        color: rgba(220, 218, 237, 0.68);
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.4em;
        text-indent: 0.4em;
        text-transform: uppercase;
        opacity: 0;
        animation: text-in 560ms ease-out 0.52s forwards;
      }

      .progress {
        position: absolute;
        left: 50%;
        bottom: 12vh;
        transform: translateX(-50%);
        width: min(280px, 48vw);
        opacity: 0;
        animation: text-in 480ms ease-out 0.7s forwards;
      }
      .progress-track {
        height: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        width: 38%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #a99cff, transparent);
        animation: progress-slide 1.6s ease-in-out infinite;
      }
      @keyframes progress-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(320%); }
      }

      @keyframes text-in {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes mark-in {
        from { opacity: 0; transform: scale(0.92); }
        to   { opacity: 1; transform: scale(1); }
      }

      html.is-fading body {
        opacity: 0;
        transition: opacity 520ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      html.is-fading .aurora,
      html.is-fading .stack,
      html.is-fading .scan {
        animation-play-state: paused;
      }
      @media (prefers-reduced-motion: reduce) {
        .motion-splash { display: none; }
        .aurora, .mark, .wordmark, .subtitle, .progress, .scan, .mark-ring, .mark-ring::before {
          animation-duration: 0.01s !important;
          animation-delay: 0s !important;
          animation-iteration-count: 1 !important;
        }
        html.is-fading body { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <video class="motion-splash" autoplay muted playsinline preload="auto" aria-hidden="true">
        <source src="./motion/hakus-startup.mp4" type="video/mp4" />
      </video>
      <div class="aurora" aria-hidden="true">
        <div class="blob blob-purple"></div>
        <div class="blob blob-blue"></div>
        <div class="blob blob-cyan"></div>
        <div class="blob blob-amber"></div>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="glass" aria-hidden="true"></div>
      <main class="stack">
        <div class="mark-ring" aria-hidden="true">
          <div class="mark">H</div>
        </div>
        <div class="copy">
          <div class="wordmark">HakusAI</div>
          <div class="subtitle">Workspace is starting</div>
        </div>
      </main>
      <div class="progress" aria-hidden="true">
        <div class="progress-track"><div class="progress-bar"></div></div>
      </div>
    </div>
    <script>
      const motionSplash = document.querySelector('.motion-splash');
      if (motionSplash) {
        motionSplash.addEventListener('canplay', () => document.documentElement.classList.add('motion-ready'), { once: true });
        motionSplash.addEventListener('error', () => motionSplash.remove(), { once: true });
      }
    </script>
  </body>
</html>
