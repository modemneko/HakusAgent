<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HakusAI</title>
    <!--
      In-window full-bleed splash (same size as the main window, not OS
      fullscreen). The Remotion-rendered motion video is the ONLY splash:
      it plays immediately and covers the whole frame. Rust triggers the
      fade via `document.documentElement.classList.add('is-fading')`.
      If the video fails to load, the frame stays a plain dark surface —
      no fallback logo splash.
    -->
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #07070c; }
      .frame {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #07070c;
      }
      .motion-splash {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }
      html.is-fading body {
        opacity: 0;
        transition: opacity 520ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        .motion-splash { display: none; }
        html.is-fading body { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <video class="motion-splash" autoplay muted playsinline preload="auto" aria-hidden="true">
        <source src="./motion/hakus-startup.mp4" type="video/mp4" />
      </video>
    </div>
    <script>
      // If the motion video cannot play, drop it and leave the plain dark
      // surface — the main window takes over once boot completes.
      const motionSplash = document.querySelector('.motion-splash');
      if (motionSplash) {
        motionSplash.addEventListener('error', () => motionSplash.remove(), { once: true });
      }
    </script>
  </body>
</html>
