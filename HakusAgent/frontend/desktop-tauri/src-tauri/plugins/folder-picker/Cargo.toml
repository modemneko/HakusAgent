[package]
name = "hakus-folder-picker"
version = "0.1.0"
description = "Android SAF folder access for HakusAI projects"
edition = "2021"

[lib]
name = "hakus_folder_picker"
crate-type = ["rlib"]

[build-dependencies]
tauri-plugin = "2"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

